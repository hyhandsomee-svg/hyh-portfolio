name: Deploy portfolio

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble archive
        run: cat portfolio-site-deploy.zip.part-00 portfolio-site-deploy.zip.part-01 portfolio-site-deploy.zip.part-02 portfolio-site-deploy.zip.part-03 portfolio-site-deploy.zip.part-04 portfolio-site-deploy.zip.part-05 portfolio-site-deploy.zip.part-06 > site.zip
      - name: Extract static site
        run: unzip -q site.zip -d _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
