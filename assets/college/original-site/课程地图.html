<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能体驱动的设计学院课程地图</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --blue: #0766eb;
        --lime: #cdff05;
        --red: #0766eb;
        --green: #cdff05;
        --signal: #0766eb;
        --ink: #111111;
        --muted: rgba(17, 17, 17, 0.48);
        --white: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background: #f7faf8;
        font-family:
          "Helvetica Neue", Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }

      .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        min-height: 720px;
        overflow: hidden;
        background:
          radial-gradient(circle at 52% 52%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.12) 42%, transparent 70%),
          radial-gradient(circle at 7% 7%, rgba(7, 102, 235, 0.1), transparent 6px),
          radial-gradient(circle at 93% 7%, rgba(7, 102, 235, 0.1), transparent 6px),
          linear-gradient(180deg, #fbfdfb, #eef3f0);
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 28px 42px 20px;
        z-index: 1;
        pointer-events: none;
        opacity: 1;
        mix-blend-mode: multiply;
        border: 1px solid rgba(7, 102, 235, 0.06);
        background:
          radial-gradient(circle at 50% 54%, rgba(255, 255, 255, 0.78), transparent 46%),
          linear-gradient(rgba(7, 102, 235, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(7, 102, 235, 0.06) 1px, transparent 1px),
          linear-gradient(rgba(7, 102, 235, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(7, 102, 235, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.96), rgba(248, 251, 249, 0.98));
        background-size: auto, 80px 80px, 80px 80px, 20px 20px, 20px 20px, auto;
        box-shadow:
          0 22px 58px rgba(12, 32, 72, 0.08),
          inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }

      .stage::after {
        content: "";
        position: absolute;
        inset: 28px 42px 20px;
        z-index: 3;
        pointer-events: none;
        opacity: 0.12;
        mix-blend-mode: multiply;
        background-image:
          linear-gradient(45deg, transparent 49.4%, rgba(7, 102, 235, 0.045) 49.6% 50.4%, transparent 50.6%),
          linear-gradient(-45deg, transparent 49.5%, rgba(7, 102, 235, 0.035) 49.7% 50.3%, transparent 50.5%);
        background-size: 320px 320px, 360px 360px;
      }

      .graph {
        position: absolute;
        inset: 0;
        z-index: 2;
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      .graph:active {
        cursor: grabbing;
      }

      #edges,
      #nodes {
        transform-box: fill-box;
        transform-origin: center;
      }

      .graph:not(.has-path):not(.is-dragging-node) #edges,
      .graph:not(.has-path):not(.is-dragging-node) #nodes {
        animation: graphFloat 7.2s ease-in-out infinite;
      }

      @keyframes graphFloat {
        0%,
        100% {
          transform: translate3d(0, 0, 0);
        }
        45% {
          transform: translate3d(0, -10px, 0);
        }
        72% {
          transform: translate3d(6px, -4px, 0);
        }
      }

      .edge {
        fill: none;
        marker-end: none;
        stroke-linecap: square;
        transition: opacity 0.28s ease, stroke 0.28s ease, stroke-width 0.28s ease;
      }

      .edge.primary {
        stroke: rgba(7, 102, 235, 0.14);
        stroke-width: 1;
      }

      .edge.secondary,
      .edge.computer {
        stroke: rgba(7, 102, 235, 0.1);
        stroke-width: 0.9;
      }

      .edge.knowledge {
        stroke: rgba(7, 102, 235, 0.1);
        stroke-width: 0.85;
      }

      .edge.cross,
      .edge.faint {
        stroke: rgba(7, 102, 235, 0.14);
        stroke-width: 0.9;
      }

      .edge.contact {
        stroke: rgba(7, 102, 235, 0.16);
        stroke-width: 1;
      }

      .graph.has-path .edge {
        stroke: rgba(7, 102, 235, 0.08);
        stroke-width: 0.75;
      }

      .route-edge {
        fill: none;
        marker-end: none;
        stroke: var(--green);
        stroke-linecap: round;
        stroke-width: 2.2;
        opacity: 0;
        filter: drop-shadow(0 0 6px rgba(205, 255, 5, 0.42));
        transition: opacity 0.28s ease;
      }

      .graph.has-path .route-edge {
        opacity: 0;
      }

      .bridge-link {
        fill: none;
        stroke: var(--lime);
        stroke-width: 1.65;
        stroke-dasharray: 6 5;
        opacity: 0;
        marker-end: none;
        filter: drop-shadow(0 0 5px rgba(205, 255, 5, 0.42));
        transition: opacity 0.28s ease;
      }

      .graph.has-path .bridge-link {
        opacity: 0.95;
      }

      .ownership-link {
        fill: none;
        stroke: var(--blue);
        stroke-width: 1.1;
        stroke-linecap: round;
        stroke-dasharray: 4 5;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s ease;
      }

      .graph.has-path .ownership-link {
        opacity: 0.55;
      }

      .bridge-card {
        opacity: 0;
        transition: opacity 0.28s ease;
      }

      .graph.has-path .bridge-card {
        opacity: 1;
      }

      .bridge-card-bg {
        fill: rgba(245, 255, 219, 0.86);
        stroke: var(--lime);
        stroke-width: 1.4;
      }

      .bridge-card-title {
        fill: rgba(17, 17, 17, 0.86);
        font-size: 12px;
        font-weight: 900;
        paint-order: stroke;
        stroke: rgba(245, 255, 219, 0.72);
        stroke-width: 3px;
      }

      .bridge-card-copy {
        fill: rgba(17, 17, 17, 0.62);
        font-size: 10px;
        font-weight: 720;
        paint-order: stroke;
        stroke: rgba(245, 255, 219, 0.72);
        stroke-width: 3px;
      }

      .node {
        cursor: grab;
        transition: opacity 0.28s ease, filter 0.28s ease;
      }

      .node:active {
        cursor: grabbing;
      }

      .node-hit {
        fill: transparent;
        pointer-events: all;
      }

      .node-halo {
        fill: none;
        stroke-width: 0.75;
      }

      .node-core {
        fill: var(--red);
        stroke: rgba(83, 68, 67, 0.78);
        stroke-width: 0.85;
        filter: none;
      }

      .node-core.design-node {
        fill: var(--red);
      }

      .node-core.computer-node {
        fill: var(--green);
      }

      .node-core.cross-node {
        fill: rgba(255, 255, 255, 0.82);
        stroke: rgba(7, 102, 235, 0.24);
      }

      .node-core.domain,
      .node-core.computerdomain,
      .node-core.embodieddomain,
      .node-core.bridge {
        stroke-width: 0.9;
      }

      .node-grain {
        fill: url(#retroNodeTexture);
        opacity: 0.18;
        pointer-events: none;
        mix-blend-mode: multiply;
      }

      .node-scan {
        display: none;
        pointer-events: none;
      }

      .node-figure {
        display: none;
      }

      .node-shadow-mark {
        display: none;
      }

      .node-line {
        display: none;
        stroke-linecap: round;
        stroke-width: 1.1;
        pointer-events: none;
      }

      .node-dot {
        display: none;
      }

      .node-green-wash {
        fill: var(--lime);
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        transition: opacity 0.28s ease;
      }

      .node.hover .node-core {
        stroke: rgba(17, 17, 17, 0.76);
        stroke-width: 2.2;
        filter: drop-shadow(0 2px 5px rgba(17, 17, 17, 0.18));
      }

      .graph.has-path .node:not(.path) {
        opacity: 0.2;
      }

      .node.path .node-core {
        stroke: rgba(17, 17, 17, 0.9);
        stroke-width: 2;
        filter: drop-shadow(0 0 6px rgba(205, 255, 5, 0.48));
      }

      .node.path .node-halo {
        stroke: var(--lime);
        stroke-width: 2;
        opacity: 0.92;
      }

      .node.path .node-green-wash {
        opacity: 0.5;
      }

      .node-index {
        fill: rgba(255, 255, 255, 0.68);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 8px;
        font-weight: 850;
        text-anchor: middle;
        dominant-baseline: central;
      }

      .root-index {
        fill: #fff;
        font-size: 12px;
      }

      .label {
        fill: rgba(17, 17, 17, 0.74);
        font-weight: 760;
        paint-order: stroke;
        stroke: rgba(255, 255, 255, 0.86);
        stroke-width: 3px;
      }

      .label.root,
      .label.computerroot {
        fill: rgba(17, 17, 17, 0.86);
        font-size: 23px;
      }

      .label.domain,
      .label.computerdomain,
      .label.embodieddomain {
        font-size: 12px;
      }

      .label.method,
      .label.bridge,
      .label.embodiedmethod,
      .label.computermethod {
        font-size: 8px;
        opacity: 0.72;
      }

      .label.leaf {
        font-size: 7px;
        font-weight: 720;
        opacity: 0;
        stroke-width: 2px;
      }

      .sub {
        display: none;
        fill: rgba(7, 38, 150, 0.62);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 7px;
        paint-order: stroke;
        stroke: rgba(255, 255, 255, 0.88);
        stroke-width: 2px;
      }

      .micro-dot {
        fill: rgba(7, 102, 235, 0.12);
      }

      .zone-band {
        fill: rgba(255, 255, 255, 0.18);
        stroke: rgba(7, 102, 235, 0.055);
        stroke-width: 1;
        stroke-dasharray: 4 10;
        pointer-events: none;
      }

      .zone-label,
      .data-tick {
        fill: rgba(7, 102, 235, 0.22);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        pointer-events: none;
      }

      .zone-label {
        font-size: 12px;
        fill: rgba(7, 102, 235, 0.28);
      }

      .tooltip {
        position: fixed;
        z-index: 8;
        max-width: 300px;
        padding: 13px 14px 14px;
        border: 1px solid rgba(7, 102, 235, 0.18);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.84);
        box-shadow: 0 18px 45px rgba(7, 102, 235, 0.14);
        backdrop-filter: blur(18px) saturate(140%);
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        transition: opacity 0.14s ease, transform 0.14s ease;
      }

      .tooltip.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .tooltip strong {
        display: block;
        margin-bottom: 4px;
        color: var(--ink);
        font-size: 15px;
      }

      .tooltip span {
        display: block;
        color: var(--blue);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .tooltip p {
        margin: 10px 0 0;
        color: rgba(17, 17, 17, 0.68);
        font-size: 12px;
        line-height: 1.65;
      }

      .chat-card {
        position: absolute;
        z-index: 6;
        top: 42px;
        left: 68px;
        width: min(470px, calc(100vw - 44px));
        min-height: 132px;
        padding: 14px 16px 12px;
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 2px;
        background:
          radial-gradient(circle at 16% 100%, rgba(7, 38, 150, 0.12), transparent 28%),
          radial-gradient(circle at 84% 0%, rgba(205, 255, 5, 0.08), transparent 30%),
          rgba(255, 255, 255, 0.68);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(16px) saturate(120%);
        transition: width 0.42s ease, min-height 0.42s ease, background 0.42s ease;
      }

      .chat-card.is-expanded {
        width: min(520px, calc(100vw - 90px));
        min-height: 680px;
        background:
          radial-gradient(circle at 18% 8%, rgba(205, 255, 5, 0.18), transparent 26%),
          rgba(255, 255, 255, 0.78);
      }

      .chat-card h2 {
        margin: 0 0 10px 22px;
        color: var(--ink);
        font-size: 18px;
        line-height: 1.2;
      }

      .composer-glass {
        display: grid;
        grid-template-columns: 1fr 40px;
        gap: 12px;
        align-items: start;
        min-height: 76px;
        padding: 14px 16px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.96);
      }

      .prompt-copy {
        width: 100%;
        min-height: 42px;
        border: 0;
        outline: 0;
        resize: none;
        background: transparent;
        color: rgba(17, 17, 17, 0.32);
        font: inherit;
        font-size: 17px;
        font-weight: 760;
        line-height: 1.45;
      }

      .prompt-copy::placeholder {
        color: rgba(17, 17, 17, 0.32);
      }

      .send {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        margin-top: 4px;
        border: 0;
        border-radius: 50%;
        background: var(--blue);
        color: var(--white);
        font-size: 21px;
        font-weight: 900;
        cursor: pointer;
      }

      .path-panel {
        display: none;
        margin-top: 18px;
        padding: 22px 18px 18px;
        border-top: 1px solid rgba(17, 17, 17, 0.22);
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.34s ease, transform 0.34s ease;
      }

      .path-panel.is-visible {
        display: block;
      }

      .path-panel.is-ready {
        opacity: 1;
        transform: translateY(0);
      }

      .path-panel.is-building {
        opacity: 0.02;
      }

      .path-head {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 14px;
        margin-bottom: 22px;
      }

      .path-title {
        margin: 0;
        color: #000;
        font-size: 24px;
        font-weight: 950;
        letter-spacing: 0;
      }

      .path-title span {
        margin-left: 10px;
        color: rgba(17, 17, 17, 0.48);
        font-size: 15px;
        font-weight: 850;
      }

      .save-path {
        height: 34px;
        padding: 0 16px;
        border: 1px solid rgba(17, 17, 17, 0.28);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
        color: #111;
        font-weight: 850;
      }

      .path-list {
        position: relative;
        display: grid;
        gap: 14px;
        margin: 0;
        padding: 0 0 0 14px;
        list-style: none;
      }

      .path-list::before {
        content: "";
        position: absolute;
        left: 29px;
        top: 14px;
        bottom: 28px;
        width: 2px;
        background: rgba(17, 17, 17, 0.25);
      }

      .path-item {
        position: relative;
        display: grid;
        grid-template-columns: 52px 1fr auto;
        align-items: center;
        gap: 12px;
        min-height: 58px;
        padding: 10px 12px 10px 0;
        border-radius: 18px;
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.32s ease, transform 0.32s ease;
      }

      .path-panel.is-ready .path-item {
        opacity: 1;
        transform: translateY(0);
      }

      .path-item.is-hovered,
      .path-item.is-selected-path {
        margin-left: -14px;
        padding-left: 14px;
        background: rgba(205, 255, 5, 0.24);
        border: 1px solid var(--blue);
      }

      .path-num {
        position: relative;
        z-index: 1;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border: 2px solid rgba(17, 17, 17, 0.28);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: var(--blue);
        font-size: 17px;
        font-weight: 950;
      }

      .path-item.is-hovered .path-num,
      .path-item.is-selected-path .path-num {
        border-color: var(--blue);
        background: var(--blue);
        color: #fff;
      }

      .path-name {
        display: block;
        color: #000;
        font-size: 17px;
        font-weight: 950;
        line-height: 1.1;
      }

      .path-en {
        display: block;
        margin-top: 7px;
        color: rgba(17, 17, 17, 0.24);
        font-size: 14px;
        font-weight: 850;
      }

      .path-tag {
        min-width: 82px;
        padding: 8px 13px;
        border-radius: 999px;
        background: rgba(7, 102, 235, 0.1);
        color: var(--blue);
        font-size: 13px;
        font-weight: 900;
        text-align: center;
      }

      .path-item.is-done .path-tag {
        background: rgba(205, 255, 5, 0.22);
        color: var(--blue);
      }

      .path-item.is-hovered .path-tag,
      .path-item.is-selected-path .path-tag {
        background: rgba(205, 255, 5, 0.24);
        color: var(--blue);
      }

      .fly-block {
        position: fixed;
        z-index: 20;
        width: 22px;
        height: 22px;
        border: 2px solid rgba(17, 17, 17, 0.72);
        background: var(--lime);
        pointer-events: none;
        transition:
          transform 0.72s cubic-bezier(0.18, 0.86, 0.22, 1),
          opacity 0.72s ease,
          width 0.72s cubic-bezier(0.18, 0.86, 0.22, 1),
          height 0.72s cubic-bezier(0.18, 0.86, 0.22, 1);
      }

      .stage {
        background:
          radial-gradient(circle at 50% 54%, rgba(255, 255, 255, 0.98), rgba(250, 252, 250, 0.9) 42%, rgba(238, 242, 239, 0.92) 74%),
          linear-gradient(180deg, #f6f7f5, #edf1ee);
      }

      .stage::before {
        inset: 36px 54px 34px;
        opacity: 0.72;
        border-color: rgba(42, 54, 58, 0.055);
        background:
          linear-gradient(rgba(86, 105, 104, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(86, 105, 104, 0.07) 1px, transparent 1px),
          linear-gradient(rgba(86, 105, 104, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(86, 105, 104, 0.035) 1px, transparent 1px);
        background-size: 96px 96px, 96px 96px, 24px 24px, 24px 24px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95);
      }

      .stage::after {
        inset: 36px 54px 34px;
        opacity: 0.08;
        background-size: 460px 460px, 520px 520px;
      }

      .graph {
        z-index: 2;
      }

      .edge.primary,
      .edge.secondary,
      .edge.computer,
      .edge.knowledge,
      .edge.cross,
      .edge.contact,
      .edge.faint {
        stroke: rgba(81, 92, 98, 0.14);
        stroke-width: 1;
        marker-end: none;
      }

      .edge.primary,
      .edge.computer {
        stroke: rgba(81, 92, 98, 0.18);
        stroke-width: 1.25;
      }

      .edge.contact {
        stroke: rgba(81, 92, 98, 0.16);
        stroke-width: 1.05;
      }

      .graph.has-path .edge {
        opacity: 0.22;
        stroke: rgba(81, 92, 98, 0.12);
      }

      .graph.has-path .edge.is-route-related {
        opacity: 0.72;
        stroke: rgba(205, 255, 5, 0.82);
        stroke-width: 2.2;
      }

      .route-edge {
        stroke: rgba(205, 255, 5, 0.88);
        stroke-width: 3.1;
        opacity: 0;
        filter: drop-shadow(0 0 5px rgba(205, 255, 5, 0.34));
      }

      .graph.has-path .route-edge {
        opacity: 0.78;
      }

      .bridge-link {
        stroke: rgba(205, 255, 5, 0.72);
        stroke-dasharray: none;
        stroke-width: 2.1;
      }

      .bridge-card {
        display: none;
      }

      .node {
        transition: opacity 0.26s ease, transform 0.26s ease, filter 0.26s ease;
      }

      .node-core {
        stroke: rgba(30, 41, 46, 0.34);
        stroke-width: 1;
        filter: none;
      }

      .node-core.design-node {
        fill: rgba(255, 255, 255, 0.72);
      }

      .node-core.computer-node {
        fill: rgba(255, 255, 255, 0.72);
      }

      .node-core.cross-node {
        fill: rgba(255, 255, 255, 0.72);
      }

      .node-core.root,
      .node-core.computerroot {
        stroke-width: 1.35;
      }

      .node-grain {
        opacity: 0.09;
      }

      .node-halo {
        opacity: 0.32;
      }

      .node.hover .node-core,
      .node.is-linked-hover .node-core {
        stroke: var(--blue);
        stroke-width: 2.4;
        filter: drop-shadow(0 4px 12px rgba(7, 102, 235, 0.2));
      }

      .graph.has-path .node:not(.path) {
        opacity: 0.28;
      }

      .node.path .node-core {
        stroke: rgba(205, 255, 5, 0.95);
        stroke-width: 2.3;
        filter: drop-shadow(0 0 8px rgba(205, 255, 5, 0.32));
      }

      .node.path .node-halo {
        stroke: rgba(205, 255, 5, 0.82);
        stroke-width: 2.2;
        opacity: 0.82;
      }

      .node.path .node-green-wash {
        opacity: 0.2;
      }

      .step-badge-bg,
      .step-badge-text {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.24s ease;
      }

      .node.has-step .step-badge-bg,
      .node.has-step .step-badge-text {
        opacity: 1;
      }

      .step-badge-bg {
        fill: rgba(255, 255, 255, 0.94);
        stroke: rgba(205, 255, 5, 0.96);

        decision_planning: [2405, 1015], hri_project: [2240, 1100], motion: [2485, 800],

        medicine: [1765, 1055], medical_foundation: [1625, 1025], medical_scene: [1710, 1145], medical_data: [1880, 1005],
        medical_compliance: [1935, 1095],
        building: [2020, 1060], architecture: [1980, 945], arch_concept: [1885, 905], structure: [2110, 905],
        urban: [2175, 990], bim: [2105, 1140], building_tech: [2235, 1065], site_analysis: [1885, 1000],
        transport: [2365, 1080], driving_scene: [2240, 1015], hmi: [2460, 995], vehicle_system: [2490, 1115], traffic_data: [2325, 1165],
        agriculture: [2415, 1155]
      };

      function point(node) {
        const fixed = terrainPositions[node.id];
        if (fixed) return { x: fixed[0], y: fixed[1], r: node.r };
        const role = nodeRole(node);
        const base = role === "design" ? { x: 600, y: 640 } : role === "cross" ? { x: 1210, y: 650 } : { x: 1930, y: 640 };
        const h = hashId(node.id);
        const angle = seeded(h) * Math.PI * 2;
        const spread = role === "cross" ? 170 : 260;
        return {
          x: gridSnap(base.x + Math.cos(angle) * spread),
          y: gridSnap(base.y + Math.sin(angle) * spread * 0.74),
          r: node.r
        };
      }

      function curve(a, b, bend = 0.2, seed = 1) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.max(1, Math.hypot(dx, dy));
        const ux = dx / len;
        const uy = dy / len;
        const startPad = Math.min(len * 0.35, (a.r || 12) * 0.9 + 4);
        const endPad = Math.min(len * 0.35, (b.r || 12) * 1.05 + 10);
        const sx = a.x + ux * startPad;
        const sy = a.y + uy * startPad;
        const ex = b.x - ux * endPad;
        const ey = b.y - uy * endPad;
        const midX = (sx + ex) / 2;
        const midY = (sy + ey) / 2;
        const lane = Math.max(-48, Math.min(48, ((seed % 7) - 3) * 9));
        const cx = midX + -uy * lane * bend;
        const cy = midY + ux * lane * bend;
        return `M${sx.toFixed(1)} ${sy.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}`;
      }

      function drawAmbient() {
        [
          { x: 160, y: 120, w: 890, h: 960, title: "HUMANITIES / DESIGN / MEDIA" },
          { x: 1035, y: 145, w: 560, h: 850, title: "CROSS-FIELD / APPLICATION" },
          { x: 1575, y: 110, w: 900, h: 1060, title: "ENGINEERING / SYSTEMS / INDUSTRY" }
        ].forEach((zone) => {
          ambient.append(el("rect", { class: "zone-band", x: zone.x, y: zone.y, width: zone.w, height: zone.h, rx: 26 }));
          const text = el("text", { class: "zone-label", x: zone.x + 22, y: zone.y + 30 });
          text.textContent = zone.title;
          ambient.append(text);
        });
        [
          ["X-04 / Y-02", 210, 1180],
          ["GROUP_ID: DESIGN_CLUSTER", 430, 1098],
          ["MATCH_SCORE: 0.86", 1120, 1045],
          ["PATH_SCORE 0.92", 1960, 1180],
          ["CROSS_FIELD 5", 2180, 1180],
          ["SELECTED_NODES 7", 2380, 1180]
        ].forEach(([copy, x, y]) => {
          const text = el("text", { class: "data-tick", x, y });
          text.textContent = copy;
          ambient.append(text);
        });
        for (let i = 0; i < 360; i++) {
          const x = 90 + seeded(i) * 2380;
          const y = 85 + seeded(i + 400) * 1110;
          const r = 0.45 + seeded(i + 800) * 1.35;
          ambient.append(el("circle", { class: "micro-dot", cx: x.toFixed(1), cy: y.toFixed(1), r: r.toFixed(1), opacity: (0.1 + seeded(i + 1200) * 0.22).toFixed(2) }));
        }
      }

      function shouldDrawEdge(from, to, type) {
        if (!byId[from] || !byId[to]) return false;
        const isContainment = parentByNode[from] === to || parentByNode[to] === from;
        if (isContainment) return true;
        const bothMajor = isMajorNode(byId[from]) && isMajorNode(byId[to]);
        if (bothMajor && (type === "primary" || type === "computer" || type === "contact")) return true;
        if (bothMajor && defaultMajorCrossEdges.has(`${from}-${to}`)) return true;
        if (readableEdges.has(`${from}-${to}`) || readableEdges.has(`${to}-${from}`)) {
          return type === "primary" || type === "computer" || type === "contact";
        }
        return false;
      }

      function drawEdges() {
        edges.forEach(([from, to, type], index) => {
          if (!shouldDrawEdge(from, to, type)) return;
          const a = point(byId[from]);
          const b = point(byId[to]);
          const bend = type === "contact" ? 0.12 : type === "primary" ? 0.08 : type === "cross" ? 0.1 : 0.08;
          const path = el("path", { class: `edge ${type}`, "data-edge": `${from}-${to}`, d: curve(a, b, bend, index + 3) });
          edgesLayer.append(path);
          edgeElements.push({ element: path, from, to, seed: index + 3, bend });
        });
      }

      function labelAnchor(node) {
        const p = point(node);
        if (!isMajorNode(node)) {
          return { x: p.x + 12, y: p.y - 3, anchor: "start" };
        }
        return { x: p.x, y: p.y - 6, anchor: "middle" };
        const role = nodeRole(node);
        const cx = role === "computer" ? 1810 : role === "cross" ? 1265 : 720;
        const cy = role === "computer" ? 470 : role === "cross" ? 615 : 760;
        const right = p.x >= cx;
        const below = p.y >= cy;
        return { x: p.x + (right ? p.r + 12 : -p.r - 12), y: p.y + (below ? 4 : -10), anchor: right ? "start" : "end" };
      }

      function cardBox(p, node, extra = 0) {
        if (isMajorNode(node)) {
          const root = node.type === "root" || node.type === "computerroot";
          const width = root ? 126 : Math.max(112, Math.min(190, 76 + node.label.length * 17));
          const height = root ? 60 : 56;
          return {
            x: p.x - width / 2 - extra / 2,
            y: p.y - height / 2 - extra / 2,
            w: width + extra,
            h: height + extra,
            rx: 14
          };
        }
        if (extra >= 30) {
          return {
            x: p.x - 12,
            y: p.y - 18,
            w: 150,
            h: 42,
            rx: 8
          };
        }
        const baseSide =
          node.type === "root" || node.type === "computerroot" ? 86 :
          node.type === "domain" || node.type === "computerdomain" || node.type === "embodieddomain" ? 58 :
          node.type === "method" || node.type === "bridge" || node.type === "embodiedmethod" || node.type === "computermethod" ? 34 :
          26;
        const side = baseSide + extra;
        return {
          x: p.x - side / 2,
          y: p.y - side / 2,
          w: side,
          h: side,
          rx: 0.8
        };
      }

      function drawKnowledgeImage(group, core, node, index) {
        const x = core.x;
        const y = core.y;
        const w = core.w;
        const h = core.h;
        const cx = x + w / 2;
        const cy = y + h / 2;
        const kind =
          node.id.includes("cs_") || node.type === "computerroot" ? "code" :
          node.cluster === "embodied" || ["ergonomics", "hci", "interaction"].includes(node.id) ? "body" :
          ["data", "dataviz", "cs_data", "cs_viz", "cs_stats", "cs_ml"].includes(node.id) ? "data" :
          ["visual", "typography", "color", "layout", "brand"].includes(node.id) ? "composition" :
          ["product", "materials", "modeling", "prototype", "hardware"].includes(node.id) ? "object" :
          "map";

        const addRect = (attrs) => group.append(el("rect", { class: "node-figure", ...attrs }));
        const addLine = (attrs) => group.append(el("line", { class: "node-line", ...attrs }));
        const addDot = (attrs) => group.append(el("circle", { class: "node-dot", ...attrs }));
        const addShadow = (attrs) => group.append(el("rect", { class: "node-shadow-mark", ...attrs }));

        if (kind === "code") {
          for (let i = 0; i < 5; i++) addLine({ x1: x + w * 0.16, y1: y + h * (0.22 + i * 0.13), x2: x + w * (0.52 + seeded(index + i) * 0.3), y2: y + h * (0.22 + i * 0.13) });
          addRect({ x: x + w * 0.62, y: y + h * 0.18, width: w * 0.18, height: h * 0.56, rx: 0.6, opacity: "0.72" });
          addDot({ cx: x + w * 0.2, cy: y + h * 0.78, r: Math.max(1.2, w * 0.035) });
          return;
        }

        if (kind === "body") {
          addDot({ cx, cy: y + h * 0.25, r: Math.max(2.2, w * 0.07) });
          addLine({ x1: cx, y1: y + h * 0.32, x2: cx, y2: y + h * 0.62 });
          addLine({ x1: cx, y1: y + h * 0.42, x2: x + w * 0.24, y2: y + h * 0.5 });
          addLine({ x1: cx, y1: y + h * 0.42, x2: x + w * 0.76, y2: y + h * 0.5 });
          addLine({ x1: cx, y1: y + h * 0.62, x2: x + w * 0.34, y2: y + h * 0.82 });
          addLine({ x1: cx, y1: y + h * 0.62, x2: x + w * 0.68, y2: y + h * 0.82 });
          return;
        }

        if (kind === "data") {
          for (let i = 0; i < 4; i++) addRect({ x: x + w * (0.16 + i * 0.17), y: y + h * (0.72 - seeded(index + i) * 0.42), width: w * 0.09, height: h * (0.18 + seeded(index + i + 9) * 0.36), rx: 0.6, opacity: "0.76" });
          addLine({ x1: x + w * 0.14, y1: y + h * 0.76, x2: x + w * 0.82, y2: y + h * 0.28 });
          return;
        }

        if (kind === "composition") {
          addRect({ x: x + w * 0.14, y: y + h * 0.18, width: w * 0.3, height: h * 0.32, rx: 0.6, opacity: "0.74" });
          addRect({ x: x + w * 0.52, y: y + h * 0.22, width: w * 0.25, height: h * 0.16, rx: 0.6, opacity: "0.6" });
          addLine({ x1: x + w * 0.18, y1: y + h * 0.68, x2: x + w * 0.8, y2: y + h * 0.68 });
          addLine({ x1: x + w * 0.18, y1: y + h * 0.78, x2: x + w * 0.64, y2: y + h * 0.78 });
          return;
        }

        if (kind === "object") {
          addShadow({ x: x + w * 0.2, y: y + h * 0.22, width: w * 0.42, height: h * 0.44, rx: 1.2, opacity: "0.35" });
          addLine({ x1: x + w * 0.22, y1: y + h * 0.7, x2: x + w * 0.74, y2: y + h * 0.34 });
          addLine({ x1: x + w * 0.38, y1: y + h * 0.78, x2: x + w * 0.78, y2: y + h * 0.78 });
          addDot({ cx: x + w * 0.73, cy: y + h * 0.35, r: Math.max(1.4, w * 0.035) });
          return;
        }

        addDot({ cx: x + w * 0.24, cy: y + h * 0.32, r: Math.max(1.7, w * 0.04) });
        addDot({ cx: x + w * 0.55, cy: y + h * 0.26, r: Math.max(1.7, w * 0.04) });
        addDot({ cx: x + w * 0.72, cy: y + h * 0.64, r: Math.max(1.7, w * 0.04) });
        addLine({ x1: x + w * 0.24, y1: y + h * 0.32, x2: x + w * 0.55, y2: y + h * 0.26 });
        addLine({ x1: x + w * 0.55, y1: y + h * 0.26, x2: x + w * 0.72, y2: y + h * 0.64 });
        addLine({ x1: x + w * 0.24, y1: y + h * 0.32, x2: x + w * 0.72, y2: y + h * 0.64 });
      }

      function drawNodes() {
        nodes.forEach((node, index) => {
          const p = point(node);
          rendered.set(node.id, { x: p.x, y: p.y, r: p.r });
          original.set(node.id, { x: p.x, y: p.y, r: p.r });
          const colorClass = nodeColorClass(node);
          const major = isMajorNode(node);
          const group = el("g", { class: `node ${node.type} ${colorClass} ${major ? "is-major" : "is-minor"}`, "data-node": node.id });
          const haloColor = colorClass === "computer-node" ? "rgba(7,102,235,.44)" : colorClass === "cross-node" ? "rgba(205,255,5,.42)" : "rgba(7,102,235,.36)";
          const hit = cardBox(p, node, 36);
          const halo = cardBox(p, node, 16);
          const core = cardBox(p, node);
          group.append(el("rect", { class: "node-hit", x: hit.x, y: hit.y, width: hit.w, height: hit.h, rx: hit.rx }));
          group.append(el("circle", { class: "node-point", cx: p.x, cy: p.y, r: major ? 0 : 3.2 }));
          group.append(el("rect", { class: "node-halo", x: halo.x, y: halo.y, width: halo.w, height: halo.h, rx: halo.rx, stroke: haloColor, opacity: node.type === "leaf" ? "0.32" : "0.7" }));
          group.append(el("rect", { class: `node-core ${node.type} ${colorClass}`, x: core.x, y: core.y, width: core.w, height: core.h, rx: core.rx }));
          group.append(el("rect", { class: "node-grain", x: core.x + 2, y: core.y + 2, width: Math.max(4, core.w - 4), height: Math.max(4, core.h - 4), rx: Math.max(0, core.rx - 1) }));
          drawKnowledgeImage(group, core, node, index);
          group.append(el("rect", { class: "node-green-wash", x: core.x + 2, y: core.y + 2, width: Math.max(4, core.w - 4), height: Math.max(4, core.h - 4), rx: Math.max(0, core.rx - 1) }));
          group.append(el("rect", { class: "node-scan", x: core.x + 5, y: core.y + core.h * 0.24, width: Math.max(6, core.w - 10), height: Math.max(1.2, core.h * 0.08), rx: 0.5 }));
          group.append(el("text", { class: `node-index ${node.type === "root" || node.type === "computerroot" ? "root-index" : ""}`, x: p.x, y: p.y }));
          group.lastChild.textContent = String(index).padStart(2, "0");
          const label = labelAnchor(node);
          group.append(el("text", { class: `label ${node.type}`, x: label.x, y: label.y, "text-anchor": label.anchor }));
          group.lastChild.textContent = node.label;
          group.append(el("text", { class: "sub", x: label.x, y: label.y + (major ? 18 : 19), "text-anchor": label.anchor }));
          group.lastChild.textContent = major ? node.en.toUpperCase() : node.en;
          const badgeX = major ? core.x - 16 : p.x - 34;
          const badgeY = major ? core.y - 10 : p.y - 14;
          group.append(el("rect", { class: "step-badge-bg", x: badgeX, y: badgeY, width: 30, height: 18, rx: 9 }));
          group.append(el("text", { class: "step-badge-text", x: badgeX + 15, y: badgeY + 9 }));
          nodesLayer.append(group);
          nodeElements.set(node.id, { group, node, radius: p.r });
          ["mouseenter", "mouseover", "pointerenter", "click"].forEach((eventName) => {
            group.addEventListener(eventName, (event) => {
              showTooltip(event, node);
              const step = activeStepByNode.get(node.id);
              if (step) setStepHover(step, true);
            });
          });
          ["mousemove", "pointermove"].forEach((eventName) => group.addEventListener(eventName, moveTooltip));
          ["mouseleave", "pointerleave"].forEach((eventName) => {
            group.addEventListener(eventName, () => {
              group.classList.remove("hover");
              const step = activeStepByNode.get(node.id);
              if (step) setStepHover(step, false);
              hideTooltip();
            });
          });
          group.addEventListener("pointerdown", (event) => startNodeDrag(event, node.id));
        });
      }

      function describe(node) {
        if (nodeNotes[node.id]) return nodeNotes[node.id];
        const field = node.cluster === "computer" ? "计算机" : node.cluster === "embodied" ? "具身智能方向" : "设计";
        if (node.type.includes("domain")) return `${node.label}是${field}中的一级领域，用来组织一组相关理论、方法和实践能力。`;
        if (node.type.includes("method")) return `${node.label}是一项方法或技能，用于把专业知识转化为可执行、可验证的工作过程。`;
        if (node.type === "bridge") return `${node.label}是跨领域知识点，常用于连接设计表达、技术实现和用户体验。`;
        return `${node.label}是${field}中的基础知识点，用于支撑更高层级的专业判断和实践。`;
      }

      function nodeMeta(node) {
        const parent = parentByNode[node.id];
        const relatedCount = edges.filter(([from, to]) => from === node.id || to === node.id).length;
        const type = isMajorNode(node) ? "MAJOR" : "ABILITY";
        const score = (0.68 + Math.min(0.29, relatedCount * 0.018)).toFixed(2);
        return `NODE_ID: ${node.id.toUpperCase()} · TYPE: ${type} · RELATED_FIELDS: ${parent ? byId[parent]?.label || parent : node.label} · MATCH_SCORE: ${score}`;
      }

      function showTooltip(event, node) {
        event.currentTarget.classList.add("hover");
        tooltip.innerHTML = `<strong>${node.label}</strong><span>${node.en}</span><span>${nodeMeta(node)}</span><p>${describe(node)}</p>`;
        tooltip.classList.add("visible");
        tooltip.setAttribute("aria-hidden", "false");
        moveTooltip(event);
      }

      function moveTooltip(event) {
        const pad = 18;
        const rect = tooltip.getBoundingClientRect();
        let x = event.clientX + 18;
        let y = event.clientY + 18;
        if (x + rect.width + pad > window.innerWidth) x = event.clientX - rect.width - 18;
        if (y + rect.height + pad > window.innerHeight) y = event.clientY - rect.height - 18;
        tooltip.style.left = `${Math.max(pad, x)}px`;
        tooltip.style.top = `${Math.max(pad, y)}px`;
      }

      function hideTooltip() {
        tooltip.classList.remove("visible");
        tooltip.setAttribute("aria-hidden", "true");
      }

      function shiftElementAttributes(element, dx, dy) {
        ["cx", "x", "x1", "x2"].forEach((attr) => {
          if (element.hasAttribute(attr)) element.setAttribute(attr, Number(element.getAttribute(attr)) + dx);
        });
        ["cy", "y", "y1", "y2"].forEach((attr) => {
          if (element.hasAttribute(attr)) element.setAttribute(attr, Number(element.getAttribute(attr)) + dy);
        });
      }

      function setNodePosition(id, x, y) {
        const current = rendered.get(id);
        const entry = nodeElements.get(id);
        if (!current || !entry) return;
        const dx = x - current.x;
        const dy = y - current.y;
        entry.group.querySelectorAll("circle, rect, line, text").forEach((child) => shiftElementAttributes(child, dx, dy));
        current.x = x;
        current.y = y;
      }

      function setNodeLabels(id, mode = "cluster", index = 0) {
        const entry = nodeElements.get(id);
        const current = rendered.get(id);
        if (!entry || !current) return;
        const texts = entry.group.querySelectorAll("text");
        const label = texts[1];
        const sub = texts[2];
        if (!label || !sub) return;
        if (mode === "path") {
          const above = index % 2 === 0;
          const y = current.y + (above ? -entry.radius - 42 : entry.radius + 34);
          [label, sub].forEach((text) => {
            text.setAttribute("x", current.x);
            text.setAttribute("text-anchor", "middle");
          });
          label.setAttribute("y", y);
          sub.setAttribute("y", y + 18);
          return;
        }
        const anchor = labelAnchor(entry.node);
        [label, sub].forEach((text) => {
          text.setAttribute("x", anchor.x);
          text.setAttribute("text-anchor", anchor.anchor);
        });
        label.setAttribute("y", anchor.y);
        sub.setAttribute("y", anchor.y + 19);
      }

      function updateEdges() {
        edgeElements.forEach((edge) => {
          const a = rendered.get(edge.from);
          const b = rendered.get(edge.to);
          if (!a || !b) return;
          edge.element.setAttribute("d", curve(a, b, edge.bend, edge.seed));
        });
      }

      function rectEdgePoint(center, target, box) {
        const dx = target.x - center.x;
        const dy = target.y - center.y;
        if (!dx && !dy) return { x: center.x, y: center.y };
        const halfW = box.w / 2;
        const halfH = box.h / 2;
        const sx = dx ? halfW / Math.abs(dx) : Infinity;
        const sy = dy ? halfH / Math.abs(dy) : Infinity;
        const scale = Math.min(sx, sy);
        return {
          x: center.x + dx * scale,
          y: center.y + dy * scale
        };
      }

      function routeAnchor(id, towardId) {
        const current = rendered.get(id);
        const target = rendered.get(towardId);
        const entry = nodeElements.get(id);
        if (!current || !target) return null;
        if (!entry || !isMajorNode(entry.node)) return { x: current.x, y: current.y };
        return rectEdgePoint(current, target, cardBox(current, entry.node));
      }

      const pathParentOverrides = {
        embodied: {
          uxresearch: "product",
          cs_require: "product",
          ergonomics: "hci",
          cs_hci: "hci",
          prototype: "product",
          cs_robot: "robotics_systems",
          modeling: "product",
          cs_embedded: "robotics_systems",
          materials: "product",
          hardware: "robotics_systems",
          hri_project: "embodied"
        }
      };

      function pathParent(id, key) {
        let parent = pathParentOverrides[key]?.[id] || parentByNode[id];
        while (parent && byId[parent] && !isMajorNode(byId[parent]) && parentByNode[parent]) {
          parent = parentByNode[parent];
        }
        if (!parent || parent === id || !byId[parent]) return null;
        return parent;
      }

      function ownershipPath(parentId, childId) {
        const start = routeAnchor(parentId, childId);
        const end = routeAnchor(childId, parentId);
        if (!start || !end) return "";
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const elbowX = start.x + dx * 0.46;
        const elbowY = end.y - Math.sign(dy || 1) * Math.min(18, Math.abs(dy) * 0.28);
        return `M${start.x.toFixed(1)} ${start.y.toFixed(1)} C${elbowX.toFixed(1)} ${start.y.toFixed(1)} ${elbowX.toFixed(1)} ${elbowY.toFixed(1)} ${end.x.toFixed(1)} ${end.y.toFixed(1)}`;
      }

      function routeCurve(a, b, index) {
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const len = Math.max(1, Math.hypot(dx, dy));
        const ux = dx / len;
        const uy = dy / len;
        const lane = (index % 2 === 0 ? -1 : 1) * Math.min(28, len * 0.035);
        const cx = (a.x + b.x) / 2 - uy * lane;
        const cy = (a.y + b.y) / 2 + ux * lane;
        return `M${a.x.toFixed(1)} ${a.y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
      }

      function updateOwnershipLinks() {
        ownershipElements.forEach((link) => {
          link.element.setAttribute("d", ownershipPath(link.parent, link.child));
        });
      }

      function updateRoute() {
        updateOwnershipLinks();
        routeElements.forEach((route, index) => {
          const a = routeAnchor(route.from, route.to);
          const b = routeAnchor(route.to, route.from);
          if (!a || !b) return;
          route.element.setAttribute("d", routeCurve(a, b, index));
        });
      }

      function bridgePath(a, b, index) {
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2 + (index % 2 === 0 ? -92 : 92);
        return `M${a.x} ${a.y} Q${midX.toFixed(1)} ${midY.toFixed(1)} ${b.x} ${b.y}`;
      }

      function bridgeCardPosition(a, b, index) {
        return {
          x: (a.x + b.x) / 2 - 118,
          y: (a.y + b.y) / 2 + (index % 2 === 0 ? -138 : 78)
        };
      }

      function setBridgeCardText(group, insight) {
        const title = group.querySelector(".bridge-card-title");
        const copy = group.querySelector(".bridge-card-copy");
        title.textContent = insight.title;
        copy.textContent = insight.copy;
      }

      function updateBridgeInsights() {
        bridgeElements.forEach((bridge, index) => {
          const a = rendered.get(bridge.from);
          const b = rendered.get(bridge.to);
          if (!a || !b) return;
          bridge.path.setAttribute("d", bridgePath(a, b, index));
          const pos = bridgeCardPosition(a, b, index);
          bridge.card.setAttribute("transform", `translate(${pos.x.toFixed(1)} ${pos.y.toFixed(1)})`);
        });
      }

      function drawBridgeInsights(key) {
        bridgesLayer.innerHTML = "";
        bridgeElements.length = 0;
        if (key !== "embodied") return;
        embodiedBridgeInsights.forEach((insight, index) => {
          const a = rendered.get(insight.from);
          const b = rendered.get(insight.to);
          if (!a || !b) return;
          const path = el("path", { class: "bridge-link", d: bridgePath(a, b, index) });
          bridgesLayer.append(path);

          const pos = bridgeCardPosition(a, b, index);
          const card = el("g", { class: "bridge-card", transform: `translate(${pos.x.toFixed(1)} ${pos.y.toFixed(1)})` });
          card.append(el("rect", { class: "bridge-card-bg", x: 0, y: 0, width: 236, height: 58, rx: 2 }));
          card.append(el("text", { class: "bridge-card-title", x: 12, y: 22 }));
          card.append(el("text", { class: "bridge-card-copy", x: 12, y: 43 }));
          setBridgeCardText(card, insight);
          bridgesLayer.append(card);
          bridgeElements.push({ ...insight, path, card });
        });
      }

      function drawRoute(ids, key) {
        routesLayer.innerHTML = "";
        routeElements.length = 0;
        ownershipElements.length = 0;
        const ownershipPairs = new Set();
        flattenedPathNodes(key).forEach((id) => {
          const parent = pathParent(id, key);
          if (!parent) return;
          const pairKey = `${parent}-${id}`;
          if (ownershipPairs.has(pairKey)) return;
          ownershipPairs.add(pairKey);
          const path = el("path", { class: "ownership-link", d: ownershipPath(parent, id) });
          routesLayer.append(path);
          ownershipElements.push({ element: path, parent, child: id });
        });
        ids.slice(0, -1).forEach((from, index) => {
          const to = ids[index + 1];
          const a = routeAnchor(from, to);
          const b = routeAnchor(to, from);
          if (!a || !b) return;
          const path = el("path", { class: "route-edge", d: routeCurve(a, b, index) });
          routesLayer.append(path);
          routeElements.push({ element: path, from, to });
        });
      }

      function animatePositions(targets, duration = 560) {
        const start = new Map();
        targets.forEach((_, id) => {
          const current = rendered.get(id);
          if (current) start.set(id, { x: current.x, y: current.y });
        });
        const startTime = performance.now();
        function frame(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          targets.forEach((target, id) => {
            const s = start.get(id);
            if (!s) return;
            setNodePosition(id, s.x + (target.x - s.x) * eased, s.y + (target.y - s.y) * eased);
          });
          updateEdges();
          updateRoute();
          updateBridgeInsights();
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      function animateViewBox(target, duration = 560) {
        const start = { ...viewBox };
        const startTime = performance.now();
        function frame(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - t, 3);
          viewBox.x = start.x + (target.x - start.x) * eased;
          viewBox.y = start.y + (target.y - start.y) * eased;
          viewBox.w = start.w + (target.w - start.w) * eased;
          viewBox.h = start.h + (target.h - start.h) * eased;
          applyViewBox();
          if (t < 1) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
      }

      function pathLayout(ids, key) {
        const targets = new Map();
        const count = ids.length;
        const startX = key === "product" ? 210 : 210;
        const endX = key === "product" ? 1370 : 2320;
        const y = 520;
        ids.forEach((id, index) => {
          const x = count === 1 ? 1275 : startX + ((endX - startX) * index) / (count - 1);
          targets.set(id, { x, y: y + (index % 2 ? 34 : -34) });
        });
        return targets;
      }

      function pathRouteSequence(key) {
        if (key === "embodied") {
          return ["product", "uxresearch", "hci", "cs_robot", "cs_embedded", "hardware", "hri_project"];
        }
        if (pathCards[key]) {
          return pathCards[key].map((item) => item.nodes[0]).filter((id) => byId[id]);
        }
        return ["design", "product", "product_strategy", "ergonomics", "prototype", "usability", "portfolio"];
      }

      function flattenedPathNodes(key) {
        const cards = pathCards[key] || [];
        return new Set(cards.flatMap((item) => item.nodes));
      }

      function clearStepState() {
        hoveredPathStep = null;
        selectedPathStep = null;
        activeStepByNode.clear();
        document.querySelectorAll(".node.has-step, .node.is-linked-hover, .node.current-step, .node.related, .node.related-major, .node.related-knowledge").forEach((node) => {
          node.classList.remove("has-step", "is-linked-hover", "current-step", "related", "related-major", "related-knowledge");
          const badge = node.querySelector(".step-badge-text");
          if (badge) badge.textContent = "";
        });
        pathList.querySelectorAll(".path-item.is-hovered, .path-item.is-selected-path").forEach((item) => item.classList.remove("is-hovered", "is-selected-path"));
        edgeElements.forEach((edge) => edge.element.classList.remove("is-route-related", "is-hovered"));
        routeElements.forEach((edge) => edge.element.classList.remove("is-hovered"));
      }

      function applyStepBadges(key) {
        clearStepState();
        const cards = pathCards[key] || [];
        cards.forEach((item, index) => {
          item.nodes.forEach((id) => {
            activeStepByNode.set(id, index + 1);
            const entry = nodeElements.get(id);
            if (!entry) return;
            entry.group.classList.add("has-step");
            if (index === 1) entry.group.classList.add("current-step");
            const badge = entry.group.querySelector(".step-badge-text");
            if (badge) badge.textContent = String(index + 1).padStart(2, "0");
          });
        });
      }

      function applyRelatedHighlights(key) {
        const profile = careerProfiles[key] || {};
        const relationMajors = new Set();
        const relationKnowledge = new Set();
        (profile.majors || (key === "embodied" ? embodiedRelatedMajors : [])).forEach((id) => relationMajors.add(id));
        (profile.knowledge || (key === "embodied" ? embodiedRelatedKnowledge : [])).forEach((id) => relationKnowledge.add(id));
        relationMajors.forEach((id) => {
          const entry = nodeElements.get(id);
          if (entry) entry.group.classList.add("related", "related-major");
        });
        relationKnowledge.forEach((id) => {
          const entry = nodeElements.get(id);
          if (entry) entry.group.classList.add("related", "related-knowledge");
        });
      }

      function markRouteEdges(key) {
        const routeIds = pathRouteSequence(key);
        const routePairs = new Set();
        routeIds.slice(0, -1).forEach((from, index) => {
          const to = routeIds[index + 1];
          routePairs.add(`${from}-${to}`);
          routePairs.add(`${to}-${from}`);
        });
        const profile = careerProfiles[key];
        (profile?.relations || []).forEach((relationId) => {
          const rule = relationRules[relationId];
          if (!rule) return;
          rule.majors.slice(0, -1).forEach((from, index) => {
            rule.majors.slice(index + 1).forEach((to) => {
              routePairs.add(`${from}-${to}`);
              routePairs.add(`${to}-${from}`);
            });
          });
        });
        if (key === "embodied") {
          embodiedBridgeInsights.forEach((link) => {
            routePairs.add(`${link.from}-${link.to}`);
            routePairs.add(`${link.to}-${link.from}`);
          });
        }
        edgeElements.forEach((edge) => {
          edge.element.classList.toggle("is-route-related", routePairs.has(`${edge.from}-${edge.to}`));
        });
      }

      function setStepHover(step, active) {
        if (!step) return;
        hoveredPathStep = active ? step : null;
        updatePathFocusState();
      }

      function setSelectedPathStep(step) {
        selectedPathStep = step;
        updatePathFocusState();
      }

      function updatePathFocusState() {
        pathList.querySelectorAll(".path-item").forEach((item) => {
          const step = Number(item.dataset.step);
          item.classList.toggle("is-hovered", hoveredPathStep === step);
          item.classList.toggle("is-selected-path", selectedPathStep === step);
        });
        document.querySelectorAll(".node.is-linked-hover").forEach((node) => node.classList.remove("is-linked-hover"));
        const activeSteps = new Set([hoveredPathStep, selectedPathStep].filter(Boolean));
        activeSteps.forEach((step) => {
          const item = pathList.querySelector(`.path-item[data-step="${step}"]`);
          if (!item) return;
          item.dataset.nodes.split(",").forEach((id) => {
            const entry = nodeElements.get(id);
            if (entry) entry.group.classList.add("is-linked-hover");
            const parent = parentByNode[id];
            const parentEntry = parent ? nodeElements.get(parent) : null;
            if (parentEntry) parentEntry.group.classList.add("is-linked-hover");
          });
        });
        routeElements.forEach((route, index) => {
          const routeStep = index + 1;
          route.element.classList.toggle(
            "is-hovered",
            hoveredPathStep === routeStep || hoveredPathStep === routeStep + 1 ||
              selectedPathStep === routeStep || selectedPathStep === routeStep + 1
          );
        });
      }

      function renderPathPanel(key) {
        const cards = pathCards[key] || [];
        pathList.innerHTML = "";
        cards.forEach((item, index) => {
          const li = document.createElement("li");
          li.className = "path-item";
          li.dataset.step = String(index + 1);
          li.dataset.nodes = item.nodes.join(",");
          li.style.transitionDelay = `${index * 0.045}s`;
          li.innerHTML = `
            <span class="path-num">${String(index + 1).padStart(2, "0")}</span>
            <span>
              <strong class="path-name">${item.title}</strong>
              <span class="path-desc">${item.desc}</span>
              <span class="path-tags">${item.tags.map((tag) => `<span class="path-tag ${tag.type}">${tag.text}</span>`).join("")}</span>
            </span>
            <button class="course-select ${index === 1 ? "is-selected" : ""}" type="button">${index === 1 ? "已选" : "选课"}</button>
          `;
          const selectButton = li.querySelector(".course-select");
          selectButton.addEventListener("click", (event) => {
            event.stopPropagation();
            const selected = selectButton.classList.toggle("is-selected");
            selectButton.textContent = selected ? "已选" : "选课";
          });
          li.addEventListener("mouseenter", () => setStepHover(index + 1, true));
          li.addEventListener("mouseleave", () => setStepHover(index + 1, false));
          li.addEventListener("click", () => setSelectedPathStep(index + 1));
          pathList.append(li);
        });
      }

      function animateBlocksIntoPanel(key) {
        const cards = pathCards[key] || [];
        const panelRect = pathPanel.getBoundingClientRect();
        cards.forEach((item, index) => {
          const sourceId = item.nodes[0];
          const sourceGroup = document.querySelector(`.node[data-node="${sourceId}"]`);
          const source = sourceGroup?.classList.contains("is-major")
            ? sourceGroup.querySelector(".node-core")
            : sourceGroup?.querySelector(".node-point");
          const target = pathList.querySelector(`.path-item[data-step="${index + 1}"] .path-num`);
          if (!source || !target) return;
          const s = source.getBoundingClientRect();
          const t = target.getBoundingClientRect();
          const block = document.createElement("div");
          block.className = "fly-block";
          block.style.left = `${s.left + s.width / 2 - 11}px`;
          block.style.top = `${s.top + s.height / 2 - 11}px`;
          block.style.opacity = "0.95";
          document.body.append(block);
          requestAnimationFrame(() => {
            block.style.width = "30px";
            block.style.height = "30px";
            block.style.opacity = "0.16";
            block.style.transform = `translate(${t.left + t.width / 2 - (s.left + s.width / 2)}px, ${t.top + t.height / 2 - (s.top + s.height / 2)}px)`;
          });
          window.setTimeout(() => block.remove(), 840 + index * 35);
        });
        window.setTimeout(() => {
          pathPanel.classList.remove("is-building");
          pathPanel.classList.add("is-ready");
        }, 760);
      }

      function activatePath(key) {
        const path = learningPaths[key];
        if (!path) return resetPath();
        const pathNodes = flattenedPathNodes(key);
        ["design", "computer", "embodied"].forEach((id) => {
          if (key === "embodied") pathNodes.add(id);
        });
        stage.classList.add("is-generated");
        graph.classList.add("has-path");
        chatCard.classList.add("is-expanded");
        mode = "result";
        const profile = careerProfiles[key] || {};
        const targetLabel = profile.label || (key === "embodied" ? "具身智能" : "产品设计");
        const nodeCount = pathCards[key]?.length || 0;
        if (agentStatus) agentStatus.querySelector("span").textContent = `目标：${targetLabel} · 已生成 ${nodeCount} 个关键学习节点`;
        const summary = pathPanel.querySelector(".path-summary");
        if (summary) summary.textContent = profile.summary || `根据目标「${targetLabel}」，已从知识图谱中提取 ${nodeCount} 个关键学习节点。`;
        document.querySelectorAll(".node").forEach((node) => node.classList.toggle("path", pathNodes.has(node.dataset.node)));
        drawRoute(pathRouteSequence(key), key);
        bridgesLayer.innerHTML = "";
        bridgeElements.length = 0;
        markRouteEdges(key);
        animateViewBox(resultViewBox, 620);
        renderPathPanel(key);
        applyStepBadges(key);
        applyRelatedHighlights(key);
        pathPanel.classList.add("is-visible", "is-building");
        pathPanel.classList.remove("is-ready");
        window.setTimeout(() => animateBlocksIntoPanel(key), 420);
      }

      function resetPath() {
        mode = "initial";
        stage.classList.remove("is-generated");
        graph.classList.remove("has-path");
        chatCard.classList.remove("is-expanded");
        routesLayer.innerHTML = "";
        bridgesLayer.innerHTML = "";
        routeElements.length = 0;
        ownershipElements.length = 0;
        bridgeElements.length = 0;
        document.querySelectorAll(".fly-block").forEach((block) => block.remove());
        if (!goalInput.value.trim()) goalInput.value = "具身智能";
        animateViewBox(initialViewBox, 520);
        pathPanel.classList.remove("is-visible", "is-ready", "is-building");
        pathList.innerHTML = "";
        document.querySelectorAll(".node.path").forEach((node) => node.classList.remove("path"));
        clearStepState();
      }

      function detectGoal(text) {
        const normalized = text.trim().toLowerCase();
        if (!normalized) return null;
        if (normalized.includes("ai 医疗") || normalized.includes("ai医疗") || normalized.includes("医疗") || normalized.includes("医学影像") || normalized.includes("数字健康")) return "aiMedical";
        if (normalized.includes("智能座舱") || normalized.includes("hmi") || normalized.includes("车联网") || normalized.includes("自动驾驶")) return "hmi";
        if (normalized.includes("游戏策划") || normalized.includes("游戏") || normalized.includes("aigc 创作") || normalized.includes("aigc创作")) return "game";
        if (normalized.includes("金融科技") || normalized.includes("fintech") || normalized.includes("风控") || normalized.includes("支付产品")) return "fintech";
        if (normalized.includes("具身") || normalized.includes("机器人") || normalized.includes("智能硬件") || normalized.includes("embodied")) return "embodied";
        if (normalized.includes("产品设计") || normalized.includes("产品")) return "product";
        return null;
      }

      function applyViewBox() {
        graph.setAttribute("viewBox", `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
      }

      graph.addEventListener("wheel", (event) => {
        event.preventDefault();
        const scale = event.deltaY > 0 ? 1.12 : 0.88;
        const rect = graph.getBoundingClientRect();
        const mx = viewBox.x + ((event.clientX - rect.left) / rect.width) * viewBox.w;
        const my = viewBox.y + ((event.clientY - rect.top) / rect.height) * viewBox.h;
        const nextW = Math.min(3600, Math.max(900, viewBox.w * scale));
        const nextH = Math.min(1800, Math.max(450, viewBox.h * scale));
        viewBox.x = mx - ((mx - viewBox.x) / viewBox.w) * nextW;
        viewBox.y = my - ((my - viewBox.y) / viewBox.h) * nextH;
        viewBox.w = nextW;
        viewBox.h = nextH;
        applyViewBox();
      }, { passive: false });

      graph.addEventListener("pointerdown", (event) => {
        if (event.target.closest(".node")) return;
        graph.setPointerCapture(event.pointerId);
        dragStart = { x: event.clientX, y: event.clientY, vx: viewBox.x, vy: viewBox.y };
      });

      graph.addEventListener("pointermove", (event) => {
        if (nodeDrag) {
          const rect = graph.getBoundingClientRect();
          const dx = ((event.clientX - nodeDrag.x) / rect.width) * viewBox.w;
          const dy = ((event.clientY - nodeDrag.y) / rect.height) * viewBox.h;
          setNodePosition(nodeDrag.id, nodeDrag.start.x + dx, nodeDrag.start.y + dy);
          updateEdges();
          updateRoute();
          updateBridgeInsights();
          return;
        }
        if (!dragStart) return;
        const rect = graph.getBoundingClientRect();
        viewBox.x = dragStart.vx - ((event.clientX - dragStart.x) / rect.width) * viewBox.w;
        viewBox.y = dragStart.vy - ((event.clientY - dragStart.y) / rect.height) * viewBox.h;
        applyViewBox();
      });

      ["pointerup", "pointerleave"].forEach((eventName) => {
        graph.addEventListener(eventName, () => {
          dragStart = null;
          nodeDrag = null;
          graph.classList.remove("is-dragging-node");
        });
      });

      function startNodeDrag(event, id) {
        event.preventDefault();
        event.stopPropagation();
        graph.setPointerCapture(event.pointerId);
        const current = rendered.get(id);
        graph.classList.add("is-dragging-node");
        nodeDrag = { id, x: event.clientX, y: event.clientY, start: { x: current.x, y: current.y } };
      }

      goalForm.addEventListener("submit", (event) => {
        event.preventDefault();
        activatePath(detectGoal(goalInput.value));
      });

      regenerateButton.addEventListener("click", resetPath);

      drawAmbient();
      drawEdges();
      drawNodes();
      applyViewBox();
      if (new URLSearchParams(window.location.search).get("demo") === "embodied") {
        goalInput.value = "具身智能";
        window.setTimeout(() => activatePath("embodied"), 260);
      }
    </script>
  
<script id="site-top-nav-script">
(function(){
  const nav = document.getElementById('siteNav');
  const toggle = document.getElementById('siteMenuToggle');
  if (!nav || !toggle) return;
  toggle.addEventListener('click', function(){
    const isOpen = nav.classList.toggle('is-menu-open');
    toggle.setAttribute('aria-expanded', String(isOpen));
    const menu = document.getElementById('siteNavMenu');
    if (menu) menu.setAttribute('aria-hidden', String(!isOpen));
  });
  document.addEventListener('click', function(event){
    if (!nav.contains(event.target)) {
      nav.classList.remove('is-menu-open');
      toggle.setAttribute('aria-expanded', 'false');
      const menu = document.getElementById('siteNavMenu');
      if (menu) menu.setAttribute('aria-hidden', 'true');
    }
  });
})();
</script>
