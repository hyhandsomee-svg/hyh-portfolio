<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>教师资源 - 华东师范大学设计学院</title>
  <style>
    /* 核心样式变量 完全保留原主题 */
    :root {
      --bg: #f2f8fb;
      --fg: #07090c;
      --muted: rgba(29,42,54,.58);
      --line: rgba(21,45,67,.12);
      --soft: rgba(255,255,255,.64);
      --accent: #0b74ff;
      --cyan: #d9f2ff;
      --lime: #eefccf;
      --panel: rgba(255,255,255,.72);
      --danger: #ff6d50;
      --ease: cubic-bezier(.19,1,.22,1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--bg); font-family: Inter, system-ui, -apple-system, sans-serif; }
    body {
      min-height: 100vh; overflow-x: hidden; color: var(--fg);
      background: radial-gradient(circle at 82% 36%, rgba(236,252,204,.88), transparent 34vw),
                  radial-gradient(circle at 24% 30%, rgba(228,245,255,.9), transparent 32vw),
                  linear-gradient(115deg,#f7fbff 0%,#eef8ff 43%,#f5ffd9 100%);
      position: relative;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: radial-gradient(circle, rgba(85,126,154,.18) 1.1px, transparent 1.2px);
      background-size: 10px 10px;
    }
    .noise { position: fixed; inset: 0; pointer-events: none; opacity: .018; mix-blend-mode: multiply; z-index: 60; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
    .cursor { position: fixed; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(11,116,255,.12), transparent 66%); pointer-events: none; z-index: 1; transform: translate(-50%,-50%); filter: blur(8px); opacity: .55; }

    /* 头部导航 完全保留原样式 */
    header {
      position: fixed; top: 26px; left: 50%; width: calc(100% - 52px); transform: translateX(-50%); z-index: 100;
      display: flex; align-items: center; justify-content: space-between; padding: 22px 24px 22px 34px;
      border-radius: 999px; background: rgba(255,255,255,.66); border: 1px solid rgba(39,61,81,.10);
      backdrop-filter: blur(22px); box-shadow: 0 18px 60px rgba(52,78,104,.08), inset 0 1px 0 rgba(255,255,255,.8);
    }
    .brand { font-size: 20px; font-weight: 760; color: #45484d; }
    nav { display: flex; gap: 8px; align-items: center; }
    .nav-link { color: #39424c; text-decoration: none; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; padding: 9px 12px; border-radius: 999px; background: rgba(255,255,255,.42); transition: .35s var(--ease); }
    .nav-link.active { color: var(--accent); background: #fff; border: 1px solid rgba(11,116,255,.14); }
    .intro-btn { border: 1px solid rgba(11,116,255,.22); color: var(--accent); background: rgba(255,255,255,.58); border-radius: 999px; padding: 10px 15px; font-size: 12px; text-transform: uppercase; cursor: pointer; transition: .35s var(--ease); }

    section { position: relative; padding: 120px 6vw; z-index: 2; }
    .kicker { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 24px; }
    .reveal { opacity: 0; transform: translateY(48px); transition: 1s var(--ease); }
    .reveal.show { opacity: 1; transform: translateY(0); }

    /* 英雄区 */
    .hero {
      display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 170px; padding-bottom: 80px;
      text-align: center; min-height: 58vh; position: relative;
    }
    .hero::before {
      content: 'Art × Technology × Education'; position: absolute; top: 28%; left: 50%; transform: translate(-50%, -50%);
      font-family: Georgia, serif; font-style: italic; font-size: clamp(16px, 1.6vw, 26px); color: rgba(33,42,48,.55); white-space: nowrap;
    }
    .hero-title { font-size: clamp(42px, 8.5vw, 126px); line-height: .9; letter-spacing: -.07em; font-weight: 820; margin-top: 1rem; }
    .hero-title span { display: block; transform: translateY(120px); opacity: 0; animation: rise 1.2s var(--ease) forwards; }
    .hero-title-cn { font-size: clamp(32px, 4.4vw, 68px); margin-bottom: .2em; }
    .hero-sub { margin-top: 32px; font-size: 18px; font-weight: 600; color: var(--muted); max-width: 720px; margin-left: auto; margin-right: auto; }
    .scroll-hint { position: absolute; left: 6vw; top: 130px; display: flex; gap: 12px; font-size: 13px; color: rgba(43,58,70,.48); }
    .wheel { width: 34px; height: 54px; border: 1px solid rgba(43,58,70,.18); border-radius: 999px; position: relative; }
    .wheel::after { content: ""; position: absolute; top: 10px; left: 50%; width: 4px; height: 9px; background: var(--accent); border-radius: 99px; transform: translateX(-50%); animation: wheel 1.6s infinite; }

    /* 搜索筛选区 */
    .search-section { padding-top: 0; padding-bottom: 32px; }
    .search-container { max-width: 1300px; margin: 0 auto; }
    .search-input { width: 100%; padding: 18px 24px 18px 56px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.58); backdrop-filter: blur(18px); font-size: 16px; outline: none; }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(11,116,255,.1); }
    .search-icon { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); }
    .filter-tabs { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .tab-btn, .toggle-btn { border: 1px solid rgba(38,70,96,.12); border-radius: 999px; padding: 10px 18px; background: rgba(255,255,255,.58); cursor: pointer; transition: .35s var(--ease); font-size: 12px; text-transform: uppercase; }
    .tab-btn.active, .toggle-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .section-toggle { display: flex; gap: 12px; margin-bottom: 24px; }

    /* 卡片网格区 占满全宽 */
    .cards-wrapper {
      max-width: 1300px;
      margin: 0 auto;
      padding-bottom: 60px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 18px;
    }
    .empty-state { text-align: center; padding: 48px; color: var(--muted); grid-column: 1/-1; }

    /* 教师方块卡片 保留头像+姓名 */
    .teacher-mini-card {
      aspect-ratio: 1;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255,255,255,.65);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: .35s var(--ease);
    }
    .teacher-mini-card:hover, .active-card { 
      background: rgba(255,255,255,.95); 
      transform: translateY(-4px); 
      box-shadow: 0 20px 40px rgba(11,116,255,.12); 
      border-color: var(--accent); 
    }
    .teacher-mini-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(11,116,255,.12), rgba(236,252,204,.7));
    }
    .teacher-mini-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .teacher-mini-name {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: var(--fg);
    }

    /* 项目卡片样式 */
    .project-mini-card {
      aspect-ratio: 1;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(255,255,255,.65);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: .35s var(--ease);
    }
    .project-mini-card:hover { 
      background: rgba(255,255,255,.95); 
      transform: translateY(-4px); 
      box-shadow: 0 20px 40px rgba(11,116,255,.12); 
      border-color: var(--accent); 
    }
    .project-mini-icon { font-size: 36px; }
    .project-mini-title {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      line-height: 1.3;
    }
    .project-mini-tag { padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 600; }
    .tag-national { background: rgba(11,116,255,.12); color: var(--accent); }
    .tag-provincial { background: rgba(139,92,246,.12); color: #7c3aed; }
    .tag-cooperation { background: rgba(16,185,129,.12); color: #10b981; }
    .tag-international { background: rgba(107,114,128,.12); color: #4b5563; }

    /* ✨ 居中弹出式详情面板 */
    .detail-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.92);
      opacity: 0;
      visibility: hidden;
      width: 90vw;
      max-width: 720px;
      max-height: 85vh;
      transition: all 0.4s var(--ease);
      z-index: 300;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(28px);
      border-radius: 28px;
      border: 1px solid var(--line);
      box-shadow: 0 30px 80px rgba(61,91,120,.18);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .detail-panel.expanded {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      visibility: visible;
    }
    .close-panel-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,.9);
      border: 1px solid var(--line);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .3s var(--ease);
      z-index: 10;
      font-weight: bold;
      font-size: 16px;
    }
    .close-panel-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .detail-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 40px 40px 32px 40px;
    }

    /* 面板内详情样式 */
    .detail-avatar-lg {
      width: 100px;
      height: 100px;
      border-radius: 24px;
      margin: 0 auto 16px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(11,116,255,.12), rgba(236,252,204,.7));
    }
    .detail-avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .detail-name-lg {
      font-size: 28px;
      font-weight: 750;
      text-align: center;
      margin-bottom: 6px;
    }
    .detail-title-lg {
      font-size: 14px;
      color: var(--accent);
      text-align: center;
      margin-bottom: 4px;
    }
    .detail-dept-lg {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }
    .detail-links {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .detail-link {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #2c3e4e;
      transition: .25s;
      font-size: 14px;
    }
    .detail-link:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .detail-section { margin-bottom: 28px; }
    .detail-section h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 3px solid var(--accent);
      padding-left: 12px;
    }
    .detail-list { list-style: none; }
    .detail-list li {
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 10px;
      line-height: 1.5;
    }
    .detail-list li::before { content: "•"; color: var(--accent); flex-shrink: 0; }
    .detail-list li:last-child { border-bottom: none; }

    /* 项目详情头部 */
    .project-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .project-detail-icon { font-size: 44px; }
    .leader-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 1px dashed var(--accent);
    }
    .project-team-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .project-team-tags span {
      background: rgba(11,116,255,.1);
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 13px;
    }

    /* 联系区 */
    .contact { min-height: 60vh; display: flex; align-items: flex-end; margin-top: 40px; }
    .contact h2 { font-size: clamp(36px, 6vw, 96px); line-height: .92; letter-spacing: -.065em; }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 12px 24px; background: rgba(255,255,255,.58); text-decoration: none; color: #111; transition: .25s; display: inline-block; }
    .pill:hover { background: var(--accent); color: white; }

    /* 遮罩层 面板展开时显示 */
    .panel-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 30, 45, 0.25);
      backdrop-filter: blur(6px);
      z-index: 299;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s var(--ease);
    }
    .panel-mask.show {
      opacity: 1;
      visibility: visible;
    }

    /* 动画 */
    @keyframes rise { to { transform: translateY(0); opacity: 1; } }
    @keyframes wheel { 0% { opacity: 0; transform: translate(-50%,0); } 100% { opacity: 0; transform: translate(-50%,22px); } }

    /* 滚动条样式 */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(11,116,255,.2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(11,116,255,.35); }

    /* 响应式适配 */
    @media (max-width: 768px) {
      .detail-panel {
        max-width: 92vw;
        max-height: 88vh;
      }
      .detail-scroll {
        padding: 32px 24px 24px 24px;
      }
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      section { padding: 90px 20px; }
      .hero::before { font-size: 12px; white-space: normal; top: 22%; }
    }
    @media (max-width: 480px) {
      .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .detail-name-lg {
        font-size: 24px;
      }
    }


    /* --- Typography & layout refinement aligned with the unified secondary pages --- */
    html,
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1d1d1f;
    }
    .brand {
      font-size: 18px;
      font-weight: 720;
      letter-spacing: -0.035em;
      color: rgba(29, 29, 31, .78);
    }
    .nav-link,
    .intro-btn {
      font-size: 12px;
      font-weight: 620;
      letter-spacing: .065em;
    }
    .hero {
      min-height: 52vh;
      padding-top: 158px;
      padding-bottom: 62px;
    }
    .hero::before {
      top: 26%;
      font-size: clamp(15px, 1.35vw, 21px);
      font-weight: 400;
      letter-spacing: -0.025em;
      color: rgba(29, 29, 31, .42);
    }
    .hero-title {
      font-size: clamp(30px, 4.35vw, 62px);
      line-height: 1.06;
      letter-spacing: -0.044em;
      font-weight: 680;
      color: rgba(29, 29, 31, .60);
      margin-top: .82rem;
    }
    .hero-title-cn {
      font-size: clamp(36px, 4.9vw, 68px);
      line-height: 1.06;
      letter-spacing: -0.046em;
      font-weight: 700;
      color: rgba(29, 29, 31, .92);
      margin-bottom: .12em;
    }
    .hero-title span:nth-child(2),
    .hero-title span:nth-child(3) {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: .58em;
      line-height: 1.06;
      letter-spacing: -0.032em;
      font-weight: 400;
      color: rgba(29, 29, 31, .54);
    }
    .hero-sub {
      margin-top: 22px;
      max-width: 680px;
      font-size: 14px;
      line-height: 1.75;
      font-weight: 480;
      color: rgba(29, 29, 31, .52);
    }
    .scroll-hint {
      color: rgba(29, 29, 31, .34);
      font-size: 12px;
      font-weight: 500;
    }
    .kicker {
      color: rgba(29, 29, 31, .44);
      font-size: 12px;
      font-weight: 620;
      letter-spacing: .12em;
    }
    .search-section {
      padding-top: 0;
      padding-bottom: 28px;
    }
    .section-toggle {
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn,
    .toggle-btn {
      font-size: 12px;
      font-weight: 620;
      letter-spacing: .025em;
      text-transform: none;
      color: rgba(29, 29, 31, .64);
      background: rgba(255, 255, 255, .58);
      box-shadow: 0 10px 28px rgba(65, 112, 148, .045);
    }
    .tab-btn.active,
    .toggle-btn.active {
      font-weight: 660;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 14px 32px rgba(11, 116, 255, .16);
    }
    .search-input {
      font-size: 14px;
      line-height: 1.6;
      font-weight: 440;
      color: rgba(29, 29, 31, .78);
      background: rgba(255, 255, 255, .62);
      box-shadow: 0 18px 48px rgba(65, 112, 148, .065);
    }
    .search-results {
      font-size: 12px !important;
      color: rgba(29, 29, 31, .42) !important;
      font-weight: 520;
    }
    .cards-wrapper {
      padding-bottom: 46px;
    }
    .teacher-mini-card,
    .project-mini-card {
      border-radius: 18px;
      background: rgba(255, 255, 255, .62);
      box-shadow: 0 14px 36px rgba(65, 112, 148, .055);
    }
    .teacher-mini-card:hover,
    .project-mini-card:hover,
    .active-card {
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 22px 52px rgba(11, 116, 255, .12);
    }
    .teacher-mini-name,
    .project-mini-title {
      font-weight: 620;
      letter-spacing: -0.018em;
      color: rgba(29, 29, 31, .82);
    }
    .teacher-mini-name {
      font-size: 13.5px;
      line-height: 1.18;
    }
    .project-mini-title {
      font-size: 13px;
      line-height: 1.35;
    }
    .project-mini-tag {
      font-size: 10.5px;
      font-weight: 620;
      letter-spacing: .02em;
    }
    .detail-panel {
      background: rgba(255, 255, 255, .90);
      box-shadow: 0 34px 90px rgba(61, 91, 120, .16);
    }
    .detail-name-lg {
      font-size: clamp(23px, 2.55vw, 30px);
      line-height: 1.1;
      letter-spacing: -0.045em;
      font-weight: 700;
      color: rgba(29, 29, 31, .90);
    }
    .detail-title-lg {
      font-size: 13px;
      font-weight: 620;
      color: rgba(11, 116, 255, .82);
    }
    .detail-dept-lg {
      font-size: 12.5px;
      color: rgba(29, 29, 31, .50);
    }
    .detail-section h3 {
      font-size: 15.5px;
      line-height: 1.35;
      font-weight: 660;
      letter-spacing: -0.018em;
      color: rgba(29, 29, 31, .84);
    }
    .detail-list li,
    .detail-section p,
    .project-team-tags span {
      font-size: 13.5px;
      line-height: 1.68;
      font-weight: 420;
      color: rgba(29, 29, 31, .62);
    }
    .leader-link {
      font-weight: 640;
    }
    .site-footer {
      position: relative;
      z-index: 2;
      width: min(1100px, calc(100% - 48px));
      margin: 56px auto 0;
      padding: 26px 12px 6px;
      border-top: 1px solid rgba(35, 72, 95, .10);
      color: rgba(29, 29, 31, .44);
      text-align: center;
      font-size: 12px;
      line-height: 1.85;
      font-weight: 430;
      letter-spacing: .01em;
    }
    @media (max-width: 768px) {
      .hero {
        min-height: 48vh;
        padding-top: 132px;
        padding-bottom: 44px;
      }
      .hero-title { font-size: clamp(30px, 8.4vw, 46px); }
      .hero-title-cn { font-size: clamp(34px, 9.2vw, 48px); }
      .hero-title span:nth-child(2),
      .hero-title span:nth-child(3) { font-size: .60em; }
      .hero-sub { font-size: 13px; }
      .site-footer { width: min(100% - 28px, 1100px); }
    }


    /* --- Unified top navigation: same form and behavior as previous secondary pages --- */
    .cursor { display: none; }
    .nav {
      min-height: 76px;
      position: sticky;
      top: 24px;
      left: auto;
      width: min(1480px, calc(100% - 48px));
      margin: 28px auto 0;
      transform: none;
      z-index: 100;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 16px;
      border: 1px solid rgba(35, 72, 95, .12);
      border-radius: 999px;

    {id:'proj9',title:'老年友好交互产品',icon:'❤️',tag:'provincial',tagText:'省部级',filter:'interaction',description:'面向认知障碍老人的智能陪伴设备与交互系统研究，提升老年群体生活质量。',team:['唐丽','李婷','周宇'],mainLeader:'tangli',duration:'2023-2026',funding:'上海市卫健委',achievements:['研发原型机2代','开展临床试验','申请专利4项']},
    {id:'proj10',title:'XR沉浸式教学空间',icon:'🥽',tag:'cooperation',tagText:'校企合作',filter:'digital',description:'联合HTC打造设计学科元宇宙教学平台，探索沉浸式教学新模式。',team:['王强','吴梅','黄伟'],mainLeader:'wangqiang',duration:'2024-2025',funding:'企业合作',achievements:['建成示范教室1间','开发课程3门']}
  ];

  // 全局状态
  let currentSection = 'teachers';
  let currentFilter = 'all';
  let currentSearch = '';

  // DOM 元素
  const teachersGrid = document.getElementById('teachersGrid');
  const projectsGrid = document.getElementById('projectsGrid');
  const emptyState = document.getElementById('emptyState');
  const detailPanel = document.getElementById('detailPanel');
  const detailContent = document.getElementById('detailContent');
  const closePanelBtn = document.getElementById('closePanel');
  const panelMask = document.getElementById('panelMask');
  const searchInput = document.getElementById('searchInput');
  const filterTabsDiv = document.getElementById('filterTabs');
  const searchResultsSpan = document.getElementById('searchResults');

  // 渲染筛选标签
  function renderFilterTabs() {
    const categories = ['all','visual','interaction','digital','product','environment','theory'];
    const labels = {all:'全部',visual:'视觉传达',interaction:'交互设计',digital:'数字媒体',product:'产品设计',environment:'环境设计',theory:'艺术理论'};
    filterTabsDiv.innerHTML = categories.map(cat => 
      `<button class="tab-btn ${currentFilter===cat ? 'active':''}" data-filter="${cat}">${labels[cat]}</button>`
    ).join('');
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        renderFilterTabs();
        renderCurrentCards();
      });
    });
  }

  // 获取筛选后的数据
  function getFilteredItems() {
    const data = currentSection === 'teachers' ? teachersData : projectsData;
    return data.filter(item => {
      const matchFilter = currentFilter === 'all' || item.filter === currentFilter;
      let searchMatch = true;
      if (currentSearch) {
        if (currentSection === 'teachers') {
          searchMatch = item.name.toLowerCase().includes(currentSearch.toLowerCase()) || 
                        item.research.some(r=>r.toLowerCase().includes(currentSearch.toLowerCase()));
        } else {
          searchMatch = item.title.toLowerCase().includes(currentSearch.toLowerCase()) || 
                        item.description.toLowerCase().includes(currentSearch.toLowerCase());
        }
      }
      return matchFilter && searchMatch;
    });
  }

  // 渲染卡片
  function renderCurrentCards() {
    const filtered = getFilteredItems();
    const grid = currentSection === 'teachers' ? teachersGrid : projectsGrid;
    grid.innerHTML = '';

    if (filtered.length === 0) {
      emptyState.style.display = 'block';
      grid.style.display = 'none';
    } else {
      emptyState.style.display = 'none';
      grid.style.display = 'grid';
    }

    filtered.forEach(item => {
      const card = document.createElement('div');
      if (currentSection === 'teachers') {
        card.className = 'teacher-mini-card';
        card.innerHTML = `
          <div class="teacher-mini-avatar">
            <img src="${item.avatar}" alt="${item.name}">
          </div>
          <div class="teacher-mini-name">${item.name}</div>
        `;
        card.addEventListener('click', () => {
          showTeacherDetail(item);
          setActiveCard(card);
        });
      } else {
        card.className = 'project-mini-card';
        card.innerHTML = `
          <div class="project-mini-icon">${item.icon}</div>
          <div class="project-mini-title">${item.title}</div>
          <div class="project-mini-tag tag-${item.tag}">${item.tagText}</div>
        `;
        card.addEventListener('click', () => {
          showProjectDetail(item);
          setActiveCard(card);
        });
      }
      grid.appendChild(card);
    });

    searchResultsSpan.innerText = `共 ${filtered.length} 条结果`;
  }

  // 高亮当前选中卡片
  function setActiveCard(card) {
    document.querySelectorAll('.teacher-mini-card, .project-mini-card').forEach(c => {
      c.classList.remove('active-card');
    });
    card.classList.add('active-card');
  }

  // 打开面板
  function openPanel() {
    detailPanel.classList.add('expanded');
    panelMask.classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  // 关闭面板
  function closePanel() {
    detailPanel.classList.remove('expanded');
    panelMask.classList.remove('show');
    document.body.style.overflow = '';
    document.querySelectorAll('.teacher-mini-card, .project-mini-card').forEach(c => {
      c.classList.remove('active-card');
    });
  }

  // 渲染教师详情
  function showTeacherDetail(teacher) {
    detailContent.innerHTML = `
      <div class="detail-avatar-lg">
        <img src="${teacher.avatar}" alt="${teacher.name}">
      </div>
      <div class="detail-name-lg">${teacher.name}</div>
      <div class="detail-title-lg">${teacher.title}</div>
      <div class="detail-dept-lg">${teacher.department}</div>
      <div class="detail-links">
        <a href="mailto:${teacher.email}" class="detail-link" title="邮箱">✉️</a>
        <a href="${teacher.website}" class="detail-link" title="个人主页" target="_blank">🌐</a>
      </div>

      <div class="detail-section">
        <h3>研究方向</h3>
        <ul class="detail-list">
          ${teacher.research.map(r => `<li>${r}</li>`).join('')}
        </ul>
      </div>

      <div class="detail-section">
        <h3>教育背景</h3>
        <ul class="detail-list">
          ${teacher.education.map(e => `<li>${e}</li>`).join('')}
        </ul>
      </div>

      <div class="detail-section">
        <h3>主要成就</h3>
        <ul class="detail-list">
          ${teacher.achievements.map(a => `<li>${a}</li>`).join('')}
        </ul>
      </div>

      <div class="detail-section">
        <h3>主讲课程</h3>
        <ul class="detail-list">
          ${teacher.courses.map(c => `<li>${c}</li>`).join('')}
        </ul>
      </div>
    `;
    openPanel();
  }

  // 渲染项目详情
  function showProjectDetail(project) {
    const leader = teachersData.find(t => t.id === project.mainLeader);
    detailContent.innerHTML = `
      <div class="project-detail-header">
        <div class="project-detail-icon">${project.icon}</div>
        <div class="project-mini-tag tag-${project.tag}">${project.tagText}</div>
      </div>
      <h2 style="font-size: 26px; margin-bottom: 20px; line-height: 1.3;">${project.title}</h2>

      <div class="detail-section">
        <h3>项目简介</h3>
        <p style="font-size: 14px; line-height: 1.7; color: rgba(20,31,42,.78);">${project.description}</p>
      </div>

      <div class="detail-section">
        <h3>主要负责人</h3>
        <a href="#" class="leader-link" data-teacher-id="${leader.id}">
          ${leader.name} · ${leader.title.split(' / ')[0]}
        </a>
      </div>

      <div class="detail-section">
        <h3>项目团队</h3>
        <div class="project-team-tags">
          ${project.team.map(m => `<span>${m}</span>`).join('')}
        </div>
      </div>

      <div class="detail-section">
        <h3>项目信息</h3>
        <ul class="detail-list">
          <li>执行时间：${project.duration}</li>
          <li>资助来源：${project.funding}</li>
        </ul>
      </div>

      <div class="detail-section">
        <h3>阶段性成果</h3>
        <ul class="detail-list">
          ${project.achievements.map(a => `<li>${a}</li>`).join('')}
        </ul>
      </div>
    `;

    // 绑定负责人跳转
    detailContent.querySelector('.leader-link')?.addEventListener('click', (e) => {
      e.preventDefault();
      const tid = e.currentTarget.dataset.teacherId;
      const teacher = teachersData.find(t => t.id === tid);
      if (teacher) {
        // 切换到教师栏目并定位
        switchSection('teachers');
        setTimeout(() => {
          showTeacherDetail(teacher);
        }, 200);
      }
    });

    openPanel();
  }

  // 切换栏目
  function switchSection(section) {
    currentSection = section;
    currentFilter = 'all';
    currentSearch = '';
    searchInput.value = '';
    renderFilterTabs();
    renderCurrentCards();
    teachersGrid.style.display = section === 'teachers' ? 'grid' : 'none';
    projectsGrid.style.display = section === 'projects' ? 'grid' : 'none';
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.section === section);
    });
  }

  // 事件绑定
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => switchSection(btn.dataset.section));
  });
  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderCurrentCards();
  });
  closePanelBtn.addEventListener('click', closePanel);
  panelMask.addEventListener('click', closePanel);



  // 顶部统一汉堡菜单
  const siteNav = document.getElementById('siteNav');
  const menuToggle = document.getElementById('menuToggle');
  menuToggle?.addEventListener('click', () => {
    const isOpen = siteNav.classList.toggle('is-menu-open');
    menuToggle.setAttribute('aria-expanded', String(isOpen));
    menuToggle.setAttribute('aria-label', isOpen ? '关闭菜单' : '打开菜单');
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      siteNav?.classList.remove('is-menu-open');
      menuToggle?.setAttribute('aria-expanded', 'false');
      menuToggle?.setAttribute('aria-label', '打开菜单');
    }
  });

  // 弹窗控制
  const modal = document.getElementById('modal');
  const openModal = document.getElementById('openModal');
  const openModal2 = document.getElementById('openModal2');
  const closeModal = document.getElementById('closeModal');
  openModal?.addEventListener('click', () => modal.style.display = 'flex');
  openModal2?.addEventListener('click', () => modal.style.display = 'flex');
  closeModal?.addEventListener('click', () => modal.style.display = 'none');
  modal?.addEventListener('click', e => { if(e.target === modal) modal.style.display = 'none'; });

  // 自定义光标
  const cursorDiv = document.getElementById('cursor');
  window.addEventListener('mousemove', e => {
    cursorDiv.style.left = e.clientX + 'px';
    cursorDiv.style.top = e.clientY + 'px';
  });

  // 滚动显隐动画
  const revealElements = document.querySelectorAll('.reveal');
  const revealObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('show');
    });
  }, { threshold: 0.1 });
  revealElements.forEach(el => revealObserver.observe(el));

  // 初始化
  renderFilterTabs();
  renderCurrentCards();
</script>

<script>
(function(){
  const nav = document.querySelector('.unified-site-nav');
  if (!nav) return;
  const toggle = nav.querySelector('.menu-toggle');
  const menu = nav.querySelector('.nav-menu-drawer');
  function closeUnifiedMenu(){
    nav.classList.remove('is-menu-open');
    if (toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', '展开目录');
    }
    if (menu) menu.setAttribute('aria-hidden', 'true');
  }
  if (toggle && menu) {
    toggle.addEventListener('click', function(event){
      event.stopPropagation();
      const isOpen = nav.classList.toggle('is-menu-open');
      toggle.setAttribute('aria-expanded', String(isOpen));
      toggle.setAttribute('aria-label', isOpen ? '收起目录' : '展开目录');
      menu.setAttribute('aria-hidden', String(!isOpen));
    });
    document.addEventListener('click', function(event){
      if (!nav.contains(event.target) && nav.classList.contains('is-menu-open')) closeUnifiedMenu();
    });
    document.addEventListener('keydown', function(event){
      if (event.key === 'Escape') closeUnifiedMenu();
    });
  }
})();
</script>



<script id="unified-menu-hotfix">
(function () {
  function setupUnifiedMenuHotfix() {
    const nav = document.querySelector('.unified-site-nav');
    const toggle = document.getElementById('menuToggle');
    const navMenu = document.getElementById('navMenu');
    if (!nav || !toggle || !navMenu || toggle.dataset.hotfixBound === 'true') return;
    toggle.dataset.hotfixBound = 'true';

    function setMenuState(isOpen) {
      nav.classList.toggle('is-menu-open', isOpen);
      toggle.setAttribute('aria-expanded', String(isOpen));
      toggle.setAttribute('aria-label', isOpen ? '收起目录' : '展开目录');
      navMenu.setAttribute('aria-hidden', String(!isOpen));
    }

    function toggleMenu(event) {
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      setMenuState(!nav.classList.contains('is-menu-open'));
    }

    // Capture phase binding prevents older duplicated click handlers from toggling twice.
    toggle.addEventListener('click', toggleMenu, true);

    navMenu.addEventListener('click', function (event) {
      const link = event.target.closest('a');
      if (link) setMenuState(false);
    });

    document.addEventListener('click', function (event) {
      if (!nav.contains(event.target)) setMenuState(false);
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') setMenuState(false);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupUnifiedMenuHotfix);
  } else {
    setupUnifiedMenuHotfix();
  }
})();
</script>
