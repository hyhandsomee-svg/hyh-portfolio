<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能体驱动的设计学院资料中心</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --blue: #0766eb;
        --lime: #cdff05;
        --ink: #15171c;
        --muted: rgba(21, 23, 28, 0.54);
        --grid: rgba(7, 102, 235, 0.055);
        --paper: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-width: 1440px;
        min-height: 1080px;
      }

      body {
        margin: 0;
        overflow: auto;
        color: var(--ink);
        background: #f7faf8;
        font-family:
          "Helvetica Neue", Inter, ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }

      .stage {
        position: relative;
        width: 1440px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 53% 50%, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.36) 42%, transparent 72%),
          linear-gradient(rgba(7, 102, 235, 0.048) 1px, transparent 1px),
          linear-gradient(90deg, rgba(7, 102, 235, 0.048) 1px, transparent 1px),
          linear-gradient(rgba(7, 102, 235, 0.018) 1px, transparent 1px),
          linear-gradient(90deg, rgba(7, 102, 235, 0.018) 1px, transparent 1px),
          linear-gradient(180deg, #fbfdfb, #f2f6f4);
        background-size: auto, 80px 80px, 80px 80px, 20px 20px, 20px 20px, auto;
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 36px;
        border: 1px solid rgba(7, 102, 235, 0.07);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.92),
          0 24px 70px rgba(12, 32, 72, 0.07);
        pointer-events: none;
      }

      .noise {
        position: absolute;
        inset: 0;
        opacity: 0.11;
        pointer-events: none;
        background-image:
          radial-gradient(circle, rgba(7, 102, 235, 0.16) 0 0.65px, transparent 0.7px),
          radial-gradient(circle, rgba(7, 102, 235, 0.08) 0 0.45px, transparent 0.5px);
        background-size: 11px 11px, 19px 19px;
        mix-blend-mode: multiply;
      }

      .mono,
      .kicker,
      .data-line {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .agent-area {
        position: absolute;
        left: 74px;
        top: 274px;
        z-index: 12;
        width: 420px;
        transition: top 0.72s cubic-bezier(0.18, 0.86, 0.2, 1);
      }

      .stage.has-results .agent-area {
        top: 132px;
      }

      h1 {
        margin: 0 0 22px;
        color: var(--ink);
        font-size: 40px;
        line-height: 1;
        letter-spacing: 0;
        font-weight: 920;
      }

      h1 .question {
        color: var(--blue);
      }

      .agent-card {
        position: relative;
        width: 370px;
        padding: 20px 18px 16px;
        border: 1px solid rgba(7, 102, 235, 0.1);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 18px 48px rgba(12, 32, 72, 0.1);
        backdrop-filter: blur(16px) saturate(125%);
      }

      .agent-card::before {
        content: "";
        display: block;
        width: 78px;
        height: 10px;
        margin: -8px 0 13px 0;
        border-radius: 999px;
        background: rgba(7, 102, 235, 0.12);
      }

      .composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: center;
        min-height: 72px;
        padding: 10px 12px;
        border: 1px solid rgba(7, 102, 235, 0.16);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.96);
      }

      textarea {
        width: 100%;
        height: 44px;
        border: 0;
        outline: 0;
        resize: none;
        color: var(--ink);
        background: transparent;
        font: inherit;
        font-size: 13px;
        line-height: 1.45;
      }

      textarea::placeholder {
        color: rgba(21, 23, 28, 0.36);
      }

      .submit {
        display: grid;
        place-items: center;
        width: 106px;
        height: 40px;
        border: 0;
        border-radius: 999px;
        background: var(--blue);
        color: #fff;
        font-size: 14px;
        font-weight: 900;
        cursor: pointer;
        white-space: nowrap;
      }

      .chips {
        display: flex;
        gap: 9px;
        margin-top: 12px;
      }

      .chip {
        height: 20px;
        min-width: 72px;
        padding: 0 10px;
        border: 1px solid rgba(21, 23, 28, 0.2);
        border-radius: 999px;
        background: #fff;
        color: rgba(21, 23, 28, 0.48);
        font: inherit;
        font-size: 10px;
        font-weight: 760;
        cursor: pointer;
        transition:
          border-color 0.2s ease,
          background 0.2s ease,
          color 0.2s ease;
      }

      .chip.is-primary,
      .chip:hover {
        border-color: var(--blue);
        background: rgba(205, 255, 5, 0.82);
        color: var(--blue);
      }

      .skeleton {
        display: flex;
        gap: 18px;
        margin: 16px 18px 0;
      }

      .skeleton span {
        width: 78px;
        height: 14px;
        border-radius: 999px;
        background: rgba(7, 102, 235, 0.08);
      }

      .fan-area {
        position: absolute;
        left: 338px;
        top: 32px;
        z-index: 2;
        width: 1054px;
        height: 860px;
        overflow: hidden;
      }

      .fan-area::before {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        z-index: 4;
        width: 236px;
        background: linear-gradient(90deg, rgba(247, 250, 248, 0.98), rgba(247, 250, 248, 0));
        pointer-events: none;
      }

      .fan-viewport {
        position: absolute;
        inset: 0;
      }

      .wheel-system {
        position: absolute;
        left: -18px;
        top: -14px;
        width: 1030px;
        height: 930px;
        --rotation: 0deg;
        --wheel-shift-x: 0px;
      }

      .wheel-system.is-idle .wheel-level.level-1 {
        animation: wheelIdle 5.8s ease-in-out infinite alternate;
      }

      @keyframes wheelIdle {
        from {
          transform: rotate(-12deg);
        }
        to {
          transform: rotate(12deg);
        }
      }

      .wheel-system.is-idle::before {
        display: none;
      }

      @keyframes wheelDialIdle {
        from {
          transform: rotate(-12deg);
        }
        to {
          transform: rotate(12deg);
        }
      }

      .wheel-system::before {
        content: "";
        display: none;
        position: absolute;
        left: calc(-14px + var(--wheel-shift-x));
        top: 58px;
        width: 790px;
        height: 790px;
        border-radius: 999px;
        background:
          repeating-conic-gradient(from -72deg, rgba(7, 102, 235, 0.028) 0 6.65deg, rgba(7, 102, 235, 0.18) 6.65deg 7.2deg),
          repeating-conic-gradient(from -72deg, transparent 0 3.25deg, rgba(7, 102, 235, 0.07) 3.25deg 3.36deg, transparent 3.36deg 7.2deg),
          radial-gradient(circle, transparent 0 148px, rgba(7, 102, 235, 0.12) 149px 150px, transparent 151px 352px, rgba(7, 102, 235, 0.14) 353px 355px, transparent 356px);
        mask-image: linear-gradient(90deg, transparent 0 37%, #000 39% 100%);
        opacity: 0.72;
        pointer-events: none;
      }

      .sector-layer {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        opacity: 0.76;
        pointer-events: none;
        transform: translateX(var(--wheel-shift-x));
        transform-origin: 381px 453px;
      }

      .wheel-system.is-idle .sector-layer {
        animation: wheelDialIdle 5.8s ease-in-out infinite alternate;
      }

      .sector-arc {
        fill: none;
        stroke: rgba(7, 102, 235, 0.17);
        stroke-linecap: round;
      }

      .sector-arc.is-outer {
        stroke-width: 2.2;
      }

      .sector-arc.is-inner {
        stroke-width: 1.7;
      }

      .sector-divider {
        stroke: rgba(7, 102, 235, 0.16);
        stroke-width: 1;
        stroke-dasharray: 4 5;
        stroke-linecap: round;
      }

      .sector-divider.is-major {
        stroke: rgba(7, 102, 235, 0.2);
        stroke-width: 2.4;
        stroke-dasharray: none;
      }

      .wheel-core {
        position: absolute;
        left: calc(316px + var(--wheel-shift-x));
        top: 388px;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 130px;
        height: 130px;
        border: 2px solid var(--blue);
        border-radius: 999px;
        background: #fff;
        color: var(--blue);
        box-shadow: 0 12px 32px rgba(12, 32, 72, 0.1);
        text-align: center;
      }

      .wheel-core span {
        font-size: 10px;
        font-weight: 820;
      }

      .wheel-core strong {
        display: block;
        margin-top: 4px;
        color: var(--ink);
        font-size: 18px;
        line-height: 1;
      }

      .wheel-level {
        position: absolute;
        left: 381px;
        top: 453px;
        z-index: 2;
        width: 0;
        height: 0;
      }

      .containment-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        overflow: visible;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.42s ease 0.88s;
      }

      .wheel-system.is-complete .containment-layer {
        opacity: 1;
      }

      .containment-parent {
        fill: none;
        stroke: var(--blue);
        stroke-width: 1.15;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.42;
      }

      .containment-spine {
        fill: none;
        stroke: var(--lime);
        stroke-width: 3;
        stroke-linecap: round;
        opacity: 0.9;
      }

      .containment-branch {
        fill: none;
        stroke: var(--blue);
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.58;
      }

      .containment-node {
        fill: var(--lime);
        stroke: var(--blue);
        stroke-width: 1.8;
      }

      .wheel-level.level-1 {
        left: calc(381px + var(--wheel-shift-x));
        transform: rotate(var(--rotation));
        transition: transform 0.9s cubic-bezier(0.18, 0.86, 0.2, 1);
      }

      .wheel-level.level-2,
      .wheel-level.level-3 {
        opacity: 0;
        transform: translateX(-28px);
        transition:
          opacity 0.34s ease,
          transform 0.72s cubic-bezier(0.18, 0.86, 0.2, 1);
      }

      .wheel-system.is-expanded .wheel-level.level-2 {
        opacity: 1;
        transform: translateX(0);
      }

      .wheel-system.is-complete .wheel-level.level-3 {
        opacity: 1;
        transform: translateX(0);
      }

      .wheel-label {
        position: absolute;
        width: var(--w, 184px);
        min-height: 34px;
        transform: rotate(var(--a)) translateX(var(--r)) rotate(calc(-1 * var(--a))) translateY(-50%);
        transform-origin: left center;
        color: rgba(21, 23, 28, 0.5);
        font-size: 12px;
        font-weight: 820;
        line-height: 1.12;
        transition:
          color 0.28s ease,
          opacity 0.28s ease,
          filter 0.28s ease;
      }

      .wheel-label.is-fixed {
        left: var(--x);
        top: var(--y);
        transform: translateY(-50%);
      }

      .wheel-label small {
        display: block;
        margin-top: 3px;
        color: rgba(7, 102, 235, 0.46);
        font-size: 8px;
        font-weight: 760;
        line-height: 1.15;
      }

      .wheel-label.field-label {
        width: var(--w, 142px);
        min-height: 22px;
        color: rgba(21, 23, 28, 0.52);
        font-size: 9.5px;
        line-height: 1.06;
        opacity: 0.82;
      }

      .wheel-system.is-idle .wheel-label.field-label {
        padding-left: 8px;
        border-left: 1px dashed rgba(7, 102, 235, 0.18);
        transform: rotate(var(--a)) translateX(var(--r)) rotate(-8deg) translateY(-50%);
      }

      .wheel-label.field-label small {
        margin-top: 2px;
        font-size: 7px;
      }

      .wheel-label.field-label::before {
        left: -16px;
        top: 6px;
        width: 6px;
        height: 6px;
      }

      .wheel-label::before {
        content: "";
        position: absolute;
        left: -20px;
        top: 8px;
        width: 8px;
        height: 8px;
        border: 1px solid rgba(7, 102, 235, 0.58);
        border-radius: 999px;
        background: #fff;
      }

      .wheel-label.is-active,
      .wheel-label.is-selected {
        color: var(--blue);
        opacity: 1;
        filter: saturate(1.1);
      }

      .wheel-label.field-label.is-active {
        font-size: 12px;
        font-weight: 920;
      }

      .wheel-label.is-active::before,
      .wheel-label.is-selected::before {
        border: 2px solid var(--blue);
        background: var(--lime);
      }

      .wheel-label.is-selected {
        width: var(--w, 250px);
        padding: 5px 8px;
        border: 2px solid var(--blue);
        border-radius: 999px;
        background: var(--lime);
        font-size: 11px;
        box-shadow: 0 8px 18px rgba(7, 102, 235, 0.12);
      }

      .wheel-label.is-selected::before {
        left: -17px;
        top: 10px;
      }

      .wheel-label.type-label {
        width: 130px;
        padding: 8px 12px;
        border: 2px solid var(--blue);
        border-radius: 999px;
        background: #fff;
        color: var(--blue);
        font-size: 13px;
        text-align: center;
      }

      .wheel-label.type-label::before {
        display: none;
      }

      .wheel-label.type-label.is-selected {
        border-color: var(--blue);
        background: var(--lime);
        color: var(--blue);
      }

      .wheel-label.resource-label.is-selected {
        display: flex;
        min-height: 50px;
        flex-direction: column;
        justify-content: center;
        padding: 7px 14px;
        border-color: var(--lime);
        background: var(--blue);
        color: #fff;
        font-size: 11px;
        line-height: 1.18;
      }

      .wheel-label.resource-label.is-selected small {
        color: rgba(255, 255, 255, 0.72);
      }

      .wheel-label.resource-label.is-selected::before {
        top: 50%;
        background: var(--blue);
        border-color: var(--lime);
        transform: translateY(-50%);
        box-shadow: 0 0 0 2px var(--lime);
      }

      .wheel-caption {
        position: absolute;
        left: 425px;
        top: 104px;
        z-index: 3;
        color: rgba(7, 102, 235, 0.42);
        font-size: 10px;
        font-weight: 760;
        letter-spacing: 0.08em;
      }

      .lock-window {
        display: none;
      }

      .data-panel {
        position: absolute;
        right: 58px;
        top: 56px;
        z-index: 6;
        display: grid;
        gap: 6px;
        min-width: 210px;
        padding: 13px 16px;
        border: 1px solid rgba(7, 102, 235, 0.1);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.9);
        color: rgba(7, 102, 235, 0.72);
        box-shadow: 0 14px 36px rgba(12, 32, 72, 0.08);
        backdrop-filter: blur(14px);
        font-size: 10px;
      }

      .overview {
        position: absolute;
        left: 74px;
        top: 532px;
        z-index: 12;
        width: 370px;
        max-height: 332px;
        padding: 16px 16px 14px;
        border: 1px solid rgba(7, 102, 235, 0.12);
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 16px 42px rgba(12, 32, 72, 0.11);
        backdrop-filter: blur(16px) saturate(125%);
        opacity: 0;
        pointer-events: none;
        transform: translateY(14px) scale(0.985);
        transition:
          opacity 0.42s ease,
          top 0.72s cubic-bezier(0.18, 0.86, 0.2, 1),
          transform 0.42s cubic-bezier(0.18, 0.86, 0.2, 1);
      }

      .stage.has-results .overview {
        top: 410px;
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }

      .overview-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: start;
        margin-bottom: 10px;
      }

      .overview h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .overview-sub {
        margin: 6px 0 0;
        color: rgba(21, 23, 28, 0.55);
        font-size: 11px;
        font-weight: 760;
      }

      .save {
        height: 28px;
        padding: 0 10px;
        border: 1px solid rgba(21, 23, 28, 0.24);
        border-radius: 999px;
        background: #fff;
        color: var(--blue);
        font: inherit;
        font-size: 10px;
        font-weight: 850;
      }

      .overview-copy {
        margin: 0 0 10px;
        color: rgba(21, 23, 28, 0.58);
        font-size: 11px;
        font-weight: 760;
        line-height: 1.5;
      }

      .overview-list {
        display: grid;
        gap: 7px;
        max-height: 202px;
        overflow: auto;
        padding-right: 5px;
      }

      .overview-list::-webkit-scrollbar {
        width: 4px;
      }

      .overview-list::-webkit-scrollbar-thumb {
        border-radius: 999px;
        background: rgba(7, 102, 235, 0.24);
      }

      .overview-item {
        display: grid;
        grid-template-columns: 36px 1fr auto;
        gap: 8px;
        align-items: center;
        min-height: 56px;
        padding: 8px 9px;
        border: 1px solid rgba(7, 102, 235, 0.12);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 6px 18px rgba(12, 32, 72, 0.04);
      }

      .overview-num {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 999px;
        background: var(--blue);
        color: #fff;
        font-size: 12px;
        font-weight: 950;
      }

      .overview-title {
        display: block;
        color: var(--ink);
        font-size: 12px;
        font-weight: 920;
        line-height: 1.25;
      }

      .overview-meta {
        display: block;
        margin-top: 4px;
        color: rgba(21, 23, 28, 0.52);
        font-size: 9px;
        font-weight: 760;
        line-height: 1.5;
      }

      .overview-action {
        min-width: 62px;
        height: 24px;
        padding: 0 10px;
        border: 1px solid var(--blue);
        border-radius: 999px;
        background: var(--lime);
        color: var(--blue);
        font: inherit;
        font-size: 9px;
        font-weight: 920;
        text-align: center;
        cursor: pointer;
        white-space: nowrap;
      }

      @media (max-width: 700px) {
        html,
        body {
          width: 100%;
          min-width: 0;
          min-height: 100%;
        }

        body {
          overflow: auto;
          background: #f7faf8;
        }

        .stage {
          box-sizing: border-box;
          display: flex;
          width: 100%;
          min-height: 100dvh;
          height: auto;
          padding: max(26px, env(safe-area-inset-top)) 18px max(30px, env(safe-area-inset-bottom));
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0;
          overflow: visible;
          transition:
            padding 0.48s cubic-bezier(0.22, 1, 0.36, 1),
            gap 0.48s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .stage.has-results {
          justify-content: flex-start;
          padding-top: max(42px, calc(env(safe-area-inset-top) + 34px));
          gap: 22px;
        }

        .stage::before {
          inset: 20px;
          border-color: rgba(7, 102, 235, 0.06);
          box-shadow: none;
        }

        .noise {
          opacity: 0.08;
        }

        .fan-area,
        .data-panel,
        .lock-window {
          display: none;
        }

        .agent-area {
          position: relative;
          left: auto;
          top: auto;
          z-index: 12;
          width: 100%;
          max-width: 460px;
          margin: 0 auto;
        }

        .stage.has-results .agent-area {
          top: auto;
        }

        h1 {
          margin: 0 0 18px;
          font-size: clamp(35px, 11vw, 48px);
          line-height: 1.06;
          letter-spacing: 0;
        }

        .agent-card {
          width: 100%;
          padding: 18px 16px 16px;
          border-radius: 26px;
          background: rgba(255, 255, 255, 0.94);
          box-shadow: 0 18px 44px rgba(12, 32, 72, 0.1);
        }

        .agent-card::before {
          width: 92px;
          height: 10px;
          margin: -6px 0 15px 0;
        }

        .composer {
          grid-template-columns: 1fr;
          gap: 12px;
          min-height: 0;
          padding: 14px;
          border-radius: 20px;
        }

        textarea {
          height: 64px;
          font-size: 16px;
          line-height: 1.45;
        }

        .submit {
          justify-self: stretch;
          width: 100%;
          height: 46px;
          font-size: 15px;
        }

        .chips {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 8px;
          margin-top: 12px;
        }

        .chip {
          min-width: 0;
          width: 100%;
          height: 28px;
          padding: 0 8px;
          font-size: 11px;
        }

        .skeleton {
          display: none;
        }

        .overview {
          position: relative;
          left: auto;
          top: auto;
          z-index: 12;
          display: none;
          width: 100%;
          max-width: 460px;
          max-height: none;
          margin: 0 auto;
          padding: 20px 16px 18px;
          border-radius: 26px;
          background: rgba(255, 255, 255, 0.94);
          box-shadow: 0 18px 44px rgba(12, 32, 72, 0.1);

      function createWheelLabel({ label, en, angle, radius, width, x, y, className = "" }) {
        const node = document.createElement("div");
        node.className = `wheel-label ${className}`.trim();
        if (Number.isFinite(x) && Number.isFinite(y)) {
          node.classList.add("is-fixed");
          node.style.setProperty("--x", `${x}px`);
          node.style.setProperty("--y", `${y}px`);
        } else {
          node.style.setProperty("--a", `${angle}deg`);

        }
        node.style.setProperty("--w", `${width}px`);
        node.innerHTML = `${label}<small>${en}</small>`;
        return node;
      }

      function polarPoint(angle, radius) {
        const radian = (angle * Math.PI) / 180;
        return {
          x: 381 + Math.cos(radian) * radius,
          y: 453 + Math.sin(radian) * radius
        };
      }

      function fixedPoint(x, y) {
        return {
          x: 381 + x,
          y: 453 + y
        };
      }

      function makeSvgNode(name, attrs) {
        const node = document.createElementNS("http://www.w3.org/2000/svg", name);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      }

      function wheelPoint(angle, radius) {
        const radian = (angle * Math.PI) / 180;
        return {
          x: 381 + Math.cos(radian) * radius,
          y: 453 + Math.sin(radian) * radius
        };
      }

      function arcPath(radius, startAngle, endAngle) {
        const start = wheelPoint(startAngle, radius);
        const end = wheelPoint(endAngle, radius);
        const largeArc = Math.abs(endAngle - startAngle) > 180 ? 1 : 0;
        return `M ${start.x.toFixed(1)} ${start.y.toFixed(1)} A ${radius} ${radius} 0 ${largeArc} 1 ${end.x.toFixed(1)} ${end.y.toFixed(1)}`;
      }

      function createSectorLayer(fields) {
        const svg = makeSvgNode("svg", {
          class: "sector-layer",
          viewBox: "0 0 1030 930",
          preserveAspectRatio: "none",
          "aria-hidden": "true"
        });
        const step = fields.length > 1 ? fields[1].angle - fields[0].angle : 7.2;
        const startAngle = fields[0].angle - step / 2;
        const endAngle = fields[fields.length - 1].angle + step / 2;
        const innerRadius = 166;
        const outerRadius = 356;

        svg.append(makeSvgNode("path", {
          class: "sector-arc is-inner",
          d: arcPath(innerRadius, startAngle, endAngle)
        }));
        svg.append(makeSvgNode("path", {
          class: "sector-arc is-outer",
          d: arcPath(outerRadius, startAngle, endAngle)
        }));

        for (let index = 0; index <= fields.length; index += 1) {
          const angle = startAngle + step * index;
          const inner = wheelPoint(innerRadius, angle);
          const outer = wheelPoint(outerRadius, angle);
          svg.append(makeSvgNode("line", {
            class: `sector-divider ${index % 4 === 0 ? "is-major" : ""}`,
            x1: inner.x.toFixed(1),
            y1: inner.y.toFixed(1),
            x2: outer.x.toFixed(1),
            y2: outer.y.toFixed(1)
          }));
        }

        return svg;
      }

      function createContainmentLayer(groups) {
        const svg = makeSvgNode("svg", {
          class: "containment-layer",
          viewBox: "0 0 1030 930",
          preserveAspectRatio: "none",
          "aria-hidden": "true"
        });

        groups.forEach((group) => {
          const parent = Number.isFinite(group.x) && Number.isFinite(group.y)
            ? fixedPoint(group.x, group.y)
            : polarPoint(group.angle, 238);
          const childPoints = group.entries.map((entry) => ({
            ...(Number.isFinite(entry.x) && Number.isFinite(entry.y) ? fixedPoint(entry.x, entry.y) : polarPoint(entry.angle, 452)),
            angle: entry.angle
          }));
          const parentRightX = parent.x + (group.width || 136);
          const parentY = parent.y;
          const firstChildX = Math.min(...childPoints.map((point) => point.x)) - 25;
          const hubX = Math.min(firstChildX - 32, parentRightX + 34);
          const minY = Math.min(...childPoints.map((point) => point.y));
          const maxY = Math.max(...childPoints.map((point) => point.y));

          svg.append(makeSvgNode("path", {
            class: "containment-parent",
            d: `M ${parentRightX.toFixed(1)} ${parentY.toFixed(1)} C ${(parentRightX + 20).toFixed(1)} ${parentY.toFixed(1)}, ${(hubX - 18).toFixed(1)} ${parentY.toFixed(1)}, ${hubX.toFixed(1)} ${parentY.toFixed(1)}`
          }));

          if (childPoints.length > 1) {
            svg.append(makeSvgNode("path", {
              class: "containment-spine",
              d: `M ${hubX.toFixed(1)} ${minY.toFixed(1)} V ${maxY.toFixed(1)}`
            }));
          } else {
            svg.append(makeSvgNode("circle", {
              class: "containment-node",
              cx: hubX.toFixed(1),
              cy: parentY.toFixed(1),
              r: "5"
            }));
          }

          childPoints.forEach((point) => {
            const endX = point.x - 22;
            svg.append(makeSvgNode("path", {
              class: "containment-branch",
              d: `M ${hubX.toFixed(1)} ${point.y.toFixed(1)} C ${(hubX + 42).toFixed(1)} ${point.y.toFixed(1)}, ${(endX - 44).toFixed(1)} ${point.y.toFixed(1)}, ${endX.toFixed(1)} ${point.y.toFixed(1)}`
            }));
            svg.append(makeSvgNode("circle", {
              class: "containment-node",
              cx: hubX.toFixed(1),
              cy: point.y.toFixed(1),
              r: "4.5"
            }));
          });
        });

        return svg;
      }

        system.className = "wheel-system";
        if (!isResult) system.classList.add("is-idle");
        if (isResult) system.style.setProperty("--wheel-shift-x", "-150px");
        system.innerHTML = `
          <div class="wheel-caption mono">RESOURCE WHEEL / FIELD → TYPE → TITLE</div>
          <div class="wheel-core mono"><span>RESOURCE</span><strong>LIBRARY</strong></div>
        `;
        const level1 = document.createElement("div");
        level1.className = "wheel-level level-1";
        wheelFields.forEach((field) => {
          const isActive = isResult && field.label === activeField.label;
          level1.append(createWheelLabel({
            label: field.label,
            en: field.en,
            angle: field.angle,
            radius: field.radius,
            width: field.width,
            className: `field-label ${isActive ? "is-active" : ""}`
          }));
        });

        const level3 = document.createElement("div");
        level3.className = "wheel-level level-3";
        const items = selected.length ? selected : resources.slice(0, 7);
        const start = -28;
        const step = items.length > 1 ? 56 / (items.length - 1) : 0;
        const rowStart = -205;
        const rowGap = 69;
        const parentX = 182;
        const childX = 426;
        const resourceAngles = items.map((item, index) => ({
          item,
          angle: start + step * index,
          x: isResult ? childX : undefined,
          y: isResult ? rowStart + index * rowGap : undefined
        }));

        const level2 = document.createElement("div");
        level2.className = "wheel-level level-2";
        const groupedAngles = new Map();
        resourceAngles.forEach((entry) => {
          const group = fieldGroup(entry.item);
          if (!groupedAngles.has(group)) groupedAngles.set(group, []);
          groupedAngles.get(group).push(entry);
        });

        const groups = Array.from(groupedAngles, ([label, entries]) => ({
          label,
          angle: entries.reduce((sum, entry) => sum + entry.angle, 0) / entries.length,
          x: isResult ? parentX : undefined,
          y: isResult ? entries.reduce((sum, entry) => sum + entry.y, 0) / entries.length : undefined,
          width: 130,
          count: entries.length,
          entries
        }));

        groups.forEach((group) => {
          level2.append(createWheelLabel({
            label: group.label,
            en: `包含 ${group.count} 个结果`,
            angle: group.angle,
            radius: 238,
            x: group.x,
            y: group.y,
            width: 130,
            className: "type-label is-selected"
          }));
        });

        items.forEach((item, index) => {
          const title = item.title.length > 42 ? `${item.title.slice(0, 42)}...` : item.title;
          level3.append(createWheelLabel({
            label: title,
            en: `${item.field} / ${typeNames[item.type] || item.type}`,
            angle: start + step * index,
            radius: 452,
            x: resourceAngles[index].x,
            y: resourceAngles[index].y,
            width: 230,
            className: `resource-label ${isResult ? "is-selected" : ""}`
          }));
        });

        const containmentLayer = isResult ? createContainmentLayer(groups) : document.createDocumentFragment();
        system.append(level1, containmentLayer, level2, level3);
        fanViewport.append(system);

        if (isResult) {
          window.setTimeout(() => {
            system.style.setProperty("--rotation", `${-activeField.angle}deg`);
          }, 40);
          window.setTimeout(() => system.classList.add("is-expanded"), 680);
          window.setTimeout(() => system.classList.add("is-complete"), 1020);
        }
      }

      function matches(resource, profile) {
        return resource.tags.some((tag) => profile.match.includes(tag)) || profile.match.includes(resource.field);
      }

      function matchesMode(resource) {
        if (activeMode === "book") return resource.type === "BOOK";
        if (activeMode === "literature") return resource.type === "JOURNAL" || resource.type === "PAPER";
        if (activeMode === "fragment") return resource.type === "PAPER";
        return true;
      }

      function fieldGroup(resource) {
        const field = resource.field;
        if (["具身智能", "具身交互", "人机协作", "HRI", "多模态交互"].includes(field)) return "具身智能";
        if (["机器人", "机器人控制", "机器人感知", "机器人学习"].includes(field)) return "机器人";
        if (["人工智能", "机器学习"].includes(field)) return "人工智能";
        if (["产品设计", "产品验证", "产品管理", "设计基础", "服务设计", "设计研究", "设计创新"].includes(field)) return "产品设计";
        if (["交互设计", "HCI", "用户研究", "用户体验", "信息架构"].includes(field)) return "交互设计";
        if (["AI 医疗", "医学", "医学影像", "数字健康", "医疗工程", "医疗人因", "医疗 AI"].includes(field)) return "AI 医疗";
        if (["智能座舱", "HMI", "人因工程"].includes(field)) return "智能座舱";
        return field;
      }

      function isChineseResource(resource) {
        return /[\u4e00-\u9fff]/.test(resource.title);
      }

      function pickResources(profile) {
        const matched = resources
          .map((resource, index) => ({ ...resource, index }))
          .filter((resource) => matches(resource, profile) && matchesMode(resource));
        const chosen = [];
        const addFirst = (predicate) => {
          const item = matched.find((resource) => predicate(resource) && !chosen.some((selectedItem) => selectedItem.index === resource.index));
          if (item) chosen.push(item);
        };

        addFirst((resource) => resource.type === "JOURNAL" && isChineseResource(resource));
        addFirst((resource) => resource.type === "JOURNAL" && !isChineseResource(resource));
        addFirst((resource) => resource.type === "BOOK" && isChineseResource(resource));
        addFirst((resource) => resource.type === "BOOK" && !isChineseResource(resource));
        addFirst((resource) => resource.type === "PAPER" && isChineseResource(resource));
        addFirst((resource) => resource.type === "PAPER" && !isChineseResource(resource));

        matched.forEach((resource) => {
          if (chosen.length < 7 && !chosen.some((selectedItem) => selectedItem.index === resource.index)) {
            chosen.push(resource);
          }
        });

        return chosen.slice(0, 7);
      }

      function renderOverview(profile) {
        overviewCopy.textContent = profile.copy;
        overviewList.innerHTML = "";
        selected.forEach((item, index) => {
          const row = document.createElement("article");
          row.className = "overview-item";
          row.innerHTML = `
            <span class="overview-num">${String(index + 1).padStart(2, "0")}</span>
            <span>
              <strong class="overview-title">${item.title}</strong>
              <span class="overview-meta">${item.field} / ${item.tags.join(" · ")}</span>
            </span>
            <button class="overview-action" type="button" aria-label="加入书架：${item.title}">加入书架</button>
          `;
          overviewList.append(row);
        });
      }

      function runSearch(value) {
        const profile = detectProfile(value);
        activeProfile = profile;
        selected = pickResources(profile);
        submitButton.textContent = "重新检索";
        stage.classList.remove("has-results");
        selectedCount.textContent = `SELECTED: ${String(selected.length).padStart(2, "0")} / ${profile.label}`;
        renderWheel(profile, true);
        renderOverview(profile);
        const resultDelay = window.matchMedia("(max-width: 700px)").matches ? 120 : 1080;
        window.setTimeout(() => stage.classList.add("has-results"), resultDelay);
      }

      function resetSearch() {
        selected = [];
        activeProfile = null;
        activeMode = "book";
        input.value = "";
        submitButton.textContent = "检索资料 →";
        selectedCount.textContent = "SELECTED: 00";
        overviewList.innerHTML = "";
        overviewCopy.textContent = "已根据你的学习方向，从资料库中转动并锁定核心阅读资料。";
        document.querySelectorAll(".chip").forEach((item) => item.classList.remove("is-primary"));
        document.querySelector('[data-mode="book"]').classList.add("is-primary");
        stage.classList.remove("has-results");
        renderWheel(null, false);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        if (stage.classList.contains("has-results")) {
          resetSearch();
          return;
        }
        runSearch(input.value);
      });

      document.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          activeMode = chip.dataset.mode || "book";
          document.querySelectorAll(".chip").forEach((item) => item.classList.remove("is-primary"));
          chip.classList.add("is-primary");
          if (stage.classList.contains("has-results")) {
            runSearch(input.value);
          }
        });
      });

      renderWheel(null, false);
    </script>
  
<script id="site-top-nav-script">
(function(){
  const nav = document.getElementById('siteNav');
  const toggle = document.getElementById('siteMenuToggle');
  if (!nav || !toggle) return;
  toggle.addEventListener('click', function(){
    const isOpen = nav.classList.toggle('is-menu-open');
    toggle.setAttribute('aria-expanded', String(isOpen));
    const menu = document.getElementById('siteNavMenu');
    if (menu) menu.setAttribute('aria-hidden', String(!isOpen));
  });
  document.addEventListener('click', function(event){
    if (!nav.contains(event.target)) {
      nav.classList.remove('is-menu-open');
      toggle.setAttribute('aria-expanded', 'false');
      const menu = document.getElementById('siteNavMenu');
      if (menu) menu.setAttribute('aria-hidden', 'true');
    }
  });
})();
</script>
